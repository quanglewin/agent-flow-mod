<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGENT//FLOW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0a0614;
    --deck: #110a21;
    --deck2: #170e2c;
    --rule: #2a1f4a;
    --ink: #ede8ff;
    --muted: #9188bc;
    --faint: #5b5285;
    --yellow: #f3e600;
    --cyan: #00e5ff;
    --magenta: #ff2e88;
    --red: #ff3355;
    --green: #3dff8f;
    --violet: #b48cff;
    --display: "Chakra Petch", ui-sans-serif, system-ui, sans-serif;
    --num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --rail: 404px;
    --cut: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--void); color: var(--ink); }
  body { font: 15px/1.45 var(--display); display: grid; grid-template-columns: 1fr var(--rail); overflow: hidden; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px); }
  button { font: inherit; color: inherit; }
  #stage, .stabs, .views, .tabs, .agents, .mapbar { -webkit-user-select: none; user-select: none; }
  canvas { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .switching { position: absolute; inset: 0; display: none; place-items: center; pointer-events: none; z-index: 3; }
  .switching.show { display: grid; }
  .switching div { background: rgba(10, 6, 20, .88); border-left: 3px solid var(--cyan); padding: 12px 18px; max-width: 46ch; }
  .switching b { display: block; font-size: 16px; }
  .switching span { color: var(--muted); font-size: 13.5px; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .chamfer { clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut))); }

  /* ---------- stage ---------- */
  #stage { position: relative; min-width: 0; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  canvas.pointing { cursor: pointer; }
  .hud { position: absolute; left: 24px; right: 24px; top: 18px; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .brand { margin: 0; font: 700 24px/1 var(--display); letter-spacing: 0.08em; color: var(--ink); pointer-events: none; white-space: nowrap; }
  .brand span { color: var(--magenta); }
  .stabs { display: flex; gap: 3px; overflow-x: auto; pointer-events: auto; scrollbar-width: none; }
  .stabs:empty { display: none; }
  .stab { --cut: 8px; --st: var(--faint); flex: none; display: grid; grid-template-columns: 9px auto; grid-template-rows: auto auto; column-gap: 9px; align-items: center;
    border: 0; padding: 6px 14px 6px 11px; background: var(--deck2); color: var(--muted); cursor: pointer; text-align: left;
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%); border-bottom: 2px solid transparent; }
  .stab i { grid-row: 1 / 3; width: 9px; height: 9px; transform: rotate(45deg); background: var(--st); }
  .stab .nm { font-weight: 600; font-size: 14px; color: var(--ink); max-width: 18ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stab .sub { font: 500 11.5px var(--num); color: var(--muted); white-space: nowrap; }
  .stab.running { --st: var(--yellow); }
  .stab.running i { box-shadow: 0 0 10px var(--yellow); }
  .stab.done { --st: var(--cyan); }
  .stab.failed { --st: var(--red); }
  .stab.closed { opacity: .5; }
  .stab[aria-selected="true"] { background: #23163e; border-bottom-color: var(--cyan); }
  .stab.ping { animation: ping 1.2s ease-in-out infinite; }
  .stab.ping .sub { color: var(--ink); }
  @keyframes ping { 50% { background: rgba(0, 229, 255, .22); } }
  .toast { position: absolute; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 6;
    background: var(--deck2); border-left: 3px solid var(--cyan); padding: 10px 16px; font-weight: 600; transition: opacity .25s, transform .25s; }
  .toast.bad { border-left-color: var(--red); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .conn { font: 500 12px/1 var(--num); color: var(--muted); display: inline-flex; align-items: center; gap: 8px; pointer-events: none; white-space: nowrap; }
  .conn i { width: 8px; height: 8px; background: var(--faint); display: inline-block; transform: rotate(45deg); }
  .conn.live i { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .conn.demo i { background: var(--yellow); box-shadow: 0 0 10px var(--yellow); }
  .views { margin-left: auto; display: inline-flex; gap: 2px; }
  .views button { --cut: 7px; border: 0; padding: 7px 16px; cursor: pointer; background: var(--deck2); color: var(--muted); font-weight: 600; }
  .views button[aria-pressed="true"] { background: var(--cyan); color: var(--void); }
  .bell { --cut: 7px; border: 0; padding: 7px 12px; cursor: pointer; background: var(--deck2); color: var(--muted); font-weight: 600; white-space: nowrap; }
  .bell[aria-pressed="true"] { background: var(--yellow); color: var(--void); }

  .attention { display: flex; flex-wrap: wrap; gap: 8px; pointer-events: auto; }
  .attention:empty { display: none; }
  .attention button { --cut: 8px; border: 0; padding: 6px 14px 6px 12px; cursor: pointer; display: inline-flex; gap: 9px; align-items: center; font-size: 13px; font-weight: 500; }
  .attention button i { width: 8px; height: 8px; transform: rotate(45deg); }
  .attention .error { background: rgba(255, 51, 85, .16); color: #ffc4cf; }
  .attention .error i { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .attention .quiet { background: rgba(243, 230, 0, .12); color: #fff6a8; }
  .attention .quiet i { background: var(--yellow); }

  .mapbar { position: absolute; left: 24px; bottom: 20px; display: flex; gap: 6px; z-index: 4; }
  canvas { touch-action: pan-y; }
  canvas.dragging { cursor: grabbing; }
  .donechip { --cut: 8px; border: 0; background: var(--deck2); color: var(--muted);
    padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 600; z-index: 4; }
  .donechip:hover { color: var(--cyan); }
  .agents button.more { display: block; color: var(--cyan); font-size: 13px; font-weight: 600; padding: 8px; }
  .tip { position: absolute; pointer-events: none; max-width: 340px; padding: 8px 11px; background: var(--deck2); border-left: 2px solid var(--cyan);
    font-size: 13px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 5; }
  .tip b { display: block; margin-bottom: 2px; font-weight: 600; }
  .tip span { font: 500 12px var(--num); color: var(--muted); }

  /* the empty message covers the stage but must never take clicks meant for the tabs above it */
  .empty { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; pointer-events: none; }
  .empty a { pointer-events: auto; }
  .hud { z-index: 5; }
  .empty.show { display: grid; }
  .empty div { max-width: 46ch; }
  .empty p { margin: 0 0 10px; color: var(--muted); }
  .empty p:first-child { color: var(--ink); font-size: 18px; font-weight: 600; }
  .empty code { font: 500 13px var(--num); color: var(--cyan); background: rgba(0, 229, 255, .08); padding: 2px 6px; }
  .empty a { color: var(--cyan); }

  /* ---------- rail ---------- */
  aside { border-left: 1px solid var(--rule); background: var(--deck); overflow-y: auto; min-height: 0; }
  aside > section { padding: 18px 20px; border-bottom: 1px solid var(--rule); }
  aside h2 { margin: 0 0 12px; font: 600 14px/1 var(--display); color: var(--muted); }

  /* the mission plate: is it done, how far, how long */
  .mission { padding: 18px 18px 16px; }
  .plate { --cut: 16px; --tone: var(--faint); background: var(--tone); padding: 1px; }
  .plate > div { --cut: 15px; background: linear-gradient(160deg, var(--deck2), var(--deck)); padding: 14px 16px 15px; }
  .plate.running { --tone: var(--yellow); }
  .plate.done { --tone: var(--cyan); }
  .plate.failed { --tone: var(--red); }
  .plate .state { display: flex; align-items: baseline; gap: 12px; }
  .plate .word { font: 700 34px/1 var(--display); letter-spacing: 0.06em; color: var(--tone); }
  .plate .clockv { margin-left: auto; font: 600 22px/1 var(--num); font-variant-numeric: tabular-nums; color: var(--ink); }
  .plate .line { margin: 10px 0 0; font-size: 15px; }
  .plate .line.soft { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
  .plate .step { margin: 10px 0 0; color: var(--ink); font-size: 14px; }
  .plate .step b { font-weight: 600; color: var(--tone); }
  .bar { position: relative; height: 10px; margin-top: 12px; background: rgba(255,255,255,.06); overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--tone); }
  .plate.running .bar i { background: repeating-linear-gradient(-45deg, var(--yellow) 0 8px, #b8ad00 8px 16px); background-size: 22.6px 22.6px; animation: hazard 1.2s linear infinite; }
  .bar.est i { opacity: .55; }
  @keyframes hazard { to { background-position: 22.6px 0; } }
  .plate.flash .word { animation: glitch .9s steps(2, end) 1; }
  @keyframes glitch {
    0% { text-shadow: 3px 0 var(--magenta), -3px 0 var(--cyan); transform: translateX(2px); }
    25% { text-shadow: -4px 0 var(--magenta), 4px 0 var(--cyan); transform: translateX(-3px); clip-path: inset(10% 0 40% 0); }
    50% { text-shadow: 2px 0 var(--magenta), -2px 0 var(--cyan); transform: none; clip-path: inset(50% 0 5% 0); }
    100% { text-shadow: none; transform: none; clip-path: none; }
  }
  .counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 14px; }
  .counts div { background: rgba(255,255,255,.03); padding: 7px 9px; }
  .counts b { display: block; font: 600 17px/1.1 var(--num); font-variant-numeric: tabular-nums; }
  .counts span { font-size: 12px; color: var(--muted); }

  .agents { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .agents button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 12px 1fr auto; gap: 10px;
    align-items: center; padding: 7px 8px; cursor: pointer; border-left: 2px solid transparent; }
  .agents button:hover { background: rgba(255, 255, 255, .04); }
  .agents button[aria-pressed="true"] { background: rgba(0, 229, 255, .07); border-left-color: var(--cyan); }
  .agents button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
  .dot { width: 9px; height: 9px; transform: rotate(45deg); }
  .agents .who { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agents .who small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .agents .st { font: 500 12px var(--num); color: var(--muted); }
  .agents .st.running { color: var(--green); }
  .agents .st.error { color: var(--red); }

  /* the selected agent */
  .agent-head h3 { margin: 0; font: 700 22px/1.15 var(--display); }
  .agent-head p { margin: 2px 0 12px; color: var(--muted); font-size: 13.5px; }
  .tabs { display: flex; gap: 2px; margin: 0 0 14px; }
  .tabs button { --cut: 7px; flex: 1; border: 0; padding: 7px 8px; cursor: pointer; background: var(--deck2); color: var(--muted); font-weight: 600; font-size: 14px; }
  .tabs button[aria-selected="true"] { background: var(--magenta); color: #1a0010; }
  .now { margin: 0 0 14px; padding: 9px 12px; background: rgba(255, 255, 255, .04); border-left: 2px solid var(--tone, var(--cyan)); font-size: 14px; }
  .eta { margin: 0 0 16px; }
  .eta .bar { margin-top: 6px; }
  .eta p { margin: 0; font-size: 13.5px; color: var(--muted); }
  .eta p b { color: var(--ink); font-weight: 600; }
  dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
  dl.facts dt { color: var(--muted); font-size: 13px; }
  dl.facts dd { margin: 0; font: 500 13px var(--num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  dl.facts dd.text { font: 400 14px/1.45 var(--display); color: #d8d2f5; }
  dl.facts dd .soft { color: var(--muted); }
  h4 { margin: 18px 0 8px; font: 600 14px var(--display); color: var(--muted); }
  .todos { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
  .todos li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; color: #cfc8ef; }
  .todos li::before { content: "◇"; color: var(--faint); }
  .todos li.completed { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(145,136,188,.5); }
  .todos li.completed::before { content: "◆"; color: var(--cyan); }
  .todos li.in_progress { color: var(--ink); }
  .todos li.in_progress::before { content: "▶"; color: var(--yellow); }
  .tools { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .tools li { display: grid; grid-template-columns: 1fr auto; gap: 10px; font-size: 13.5px; padding: 4px 6px; background: rgba(255,255,255,.015); border-left: 2px solid transparent; }
  .tools li.open { background: rgba(57, 255, 20, 0.05); border-left-color: var(--green); }
  .tools li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ddd6ff; }
  .tools li span:last-child { font: 500 12px var(--num); color: var(--muted); }
  .tools li.open span:last-child { color: var(--green); font-weight: 600; }
  .tool-cmd { grid-column: 1 / -1; margin-top: 3px; }
  .tool-cmd code { display: block; padding: 4px 8px; background: rgba(0,0,0,0.3); font: 400 12px var(--num); color: #9f97c7; white-space: pre-wrap; word-break: break-all; }
  .quote { margin: 0; padding: 10px 12px; border-left: 2px solid var(--tone, var(--cyan)); background: rgba(255, 255, 255, .03);
    font-size: 14px; line-height: 1.5; color: #e0daf9; white-space: pre-wrap; overflow-wrap: anywhere; }

  /* live tool execution card */
  .live-card { margin: 0 0 16px; padding: 12px 14px; background: rgba(0, 240, 255, 0.06); border: 1px solid rgba(0, 240, 255, 0.3); border-left: 3px solid var(--cyan); }
  .live-card.long { background: rgba(255, 230, 0, 0.08); border-color: rgba(255, 230, 0, 0.4); border-left-color: var(--yellow); }
  .live-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse-glow 1.4s ease-in-out infinite; }
  .live-card.long .live-dot { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
  @keyframes pulse-glow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.85); } }
  .live-tool { font: 700 13px var(--display); letter-spacing: 0.05em; color: var(--tone, var(--cyan)); text-transform: uppercase; }
  .live-time { margin-left: auto; font: 600 12px var(--num); color: var(--yellow); background: rgba(0,0,0,0.35); padding: 2px 7px; border-radius: 2px; }
  .live-desc { font-size: 14px; color: #fff; margin-bottom: 6px; font-weight: 500; }
  .live-cmd { margin-top: 6px; }
  .live-cmd code { display: block; padding: 8px 10px; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.08); font: 400 12.5px/1.4 var(--num); color: #7fe7ff; white-space: pre-wrap; word-break: break-all; max-height: 140px; overflow-y: auto; user-select: all; }

  /* mission live execution strip */
  .mission-live { margin: 10px 0 0; padding: 8px 10px; background: rgba(57, 255, 20, 0.08); border: 1px solid rgba(57, 255, 20, 0.25); cursor: pointer; transition: background .15s; }
  .mission-live:hover { background: rgba(57, 255, 20, 0.14); }
  .mission-live-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
  .mission-live-row code { font: 500 12px var(--num); color: var(--cyan); background: rgba(0,0,0,0.3); padding: 1px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .mission-live-row .time-tag { margin-left: auto; font: 600 11.5px var(--num); color: var(--yellow); }

  /* context */
  .ctx-sum { margin: 0 0 10px; font-size: 14px; }
  .ctx-sum b { font: 600 15px var(--num); }
  .stack { display: flex; height: 16px; gap: 2px; margin: 0 0 10px; }
  .stack i { display: block; min-width: 3px; }
  .legend { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 4px; font-size: 13.5px; }
  .legend li { display: grid; grid-template-columns: 10px 1fr auto; gap: 9px; align-items: center; }
  .legend li i { width: 10px; height: 10px; }
  .legend li span:last-child { font: 500 12.5px var(--num); color: var(--muted); }
  .legend li.est span:nth-child(2)::after { content: " (estimate)"; color: var(--faint); }
  .note { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .entries { list-style: none; margin: 0; padding: 0; max-height: 460px; overflow-y: auto; border-top: 1px solid var(--rule); }
  .entries li { border-bottom: 1px solid rgba(42, 31, 74, .7); }
  .entries summary { display: grid; grid-template-columns: 8px 1fr auto; gap: 9px; align-items: center; padding: 7px 4px; cursor: pointer; list-style: none; font-size: 13.5px; }
  .entries summary::-webkit-details-marker { display: none; }
  .entries summary i { width: 8px; height: 8px; transform: rotate(45deg); }
  .entries summary span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entries summary span:last-child { font: 500 12px var(--num); color: var(--muted); }
  .entries pre { margin: 0 0 8px 21px; padding: 8px 10px; background: rgba(0,0,0,.28); font: 400 12px/1.5 var(--num); color: #cfc8ef;
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow-y: auto; }
  .skipped { padding: 7px 4px; font-size: 13px; color: var(--faint); }

  /* packet lists */
  .wire { list-style: none; margin: 0; padding: 0; }
  .wire li { border-top: 1px solid rgba(42, 31, 74, .7); }
  .wire li:first-child { border-top: 0; }
  .wire button { all: unset; box-sizing: border-box; width: 100%; display: block; padding: 9px 4px; cursor: pointer; }
  .wire button:hover { background: rgba(255,255,255,.03); }
  .wire button:focus-visible { outline: 2px solid var(--cyan); }
  .wire .route { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-weight: 600; font-size: 14px; }
  .wire .route > span { white-space: nowrap; }
  .wire .route .arrow { color: var(--faint); }
  .wire .meta { margin-left: auto; font: 500 12px var(--num); color: var(--muted); white-space: nowrap; }
  .kind { font: 500 11.5px var(--display); padding: 1px 7px; background: rgba(255, 255, 255, .07); color: #cfc8ef; white-space: nowrap; }
  .kind.spawn { background: rgba(0, 229, 255, .13); color: #9ff4ff; }
  .kind.report { background: rgba(61, 255, 143, .12); color: #a8ffcb; }
  .kind.message { background: rgba(255, 46, 136, .15); color: #ffb3d4; }
  .wire p { margin: 4px 0 0; color: #bdb5e2; font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .wire li.fresh { animation: fresh 1.6s ease-out; }
  @keyframes fresh { from { background: rgba(255, 46, 136, .12); } to { background: transparent; } }
  .wire-empty { color: var(--muted); margin: 0; font-size: 14px; }

  /* packet inspector */
  .drawer { position: fixed; top: 0; bottom: 0; right: var(--rail); width: min(560px, calc(100vw - var(--rail))); z-index: 20; display: none;
    background: var(--deck2); border-left: 2px solid var(--magenta); box-shadow: -20px 0 60px rgba(0,0,0,.55); flex-direction: column; }
  .drawer.open { display: flex; }
  .drawer header { padding: 18px 20px 14px; border-bottom: 1px solid var(--rule); }
  .drawer header .row { display: flex; align-items: center; gap: 10px; }
  .drawer header h2 { margin: 0; font: 700 20px/1.2 var(--display); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .drawer header h2 .arrow { color: var(--faint); }
  .drawer .close { --cut: 7px; margin-left: auto; border: 0; background: var(--deck); padding: 6px 12px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .drawer .sub { margin: 8px 0 0; font: 500 12.5px var(--num); color: var(--muted); }
  .drawer .scroll { overflow-y: auto; padding: 16px 20px 24px; }
  .drawer dl.facts { margin-bottom: 18px; }
  .drawer .bodyhead { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
  .drawer .bodyhead h3 { margin: 0; font: 600 14px var(--display); color: var(--muted); }
  .drawer .copy { --cut: 6px; margin-left: auto; border: 0; background: var(--deck); padding: 5px 10px; cursor: pointer; color: var(--cyan); font-size: 13px; font-weight: 600; }
  .drawer pre { margin: 0; padding: 12px 14px; background: rgba(0,0,0,.3); border-left: 2px solid var(--magenta);
    font: 400 12.5px/1.6 var(--num); color: #e6e0ff; white-space: pre-wrap; overflow-wrap: anywhere; }

  @media (max-width: 1500px) { .bell .lbl { display: none; } }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: 62vh auto; overflow: auto; }
    aside { border-left: 0; border-top: 1px solid var(--rule); }
    .brand { font-size: 17px; }
    .conn span { display: none; }
    .hud { left: 14px; right: 14px; top: 14px; }
    .top { gap: 8px 10px; }
    .views button { padding: 6px 11px; }
    .bell .lbl { display: none; }
    .drawer { right: 0; width: 100vw; }
    .counts { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wire li.fresh, .plate.flash .word, .plate.running .bar i { animation: none; }
  }
</style>
</head>
<body>
<main id="stage">
  <canvas id="c" aria-label="The session's agents: who handed work to whom, and what each is doing"></canvas>
  <div class="hud" id="hud">
  <div class="top">
    <h1 class="brand">AGENT<span>//</span>FLOW</h1>
    <span class="conn" id="conn" title="Whether Claude Code is sending updates to this page"><i></i><span>Waiting</span></span>
    <div class="views" role="group" aria-label="View">
      <button type="button" class="chamfer" data-view="map" aria-pressed="true">Map</button>
      <button type="button" class="chamfer" data-view="timeline" aria-pressed="false">Timeline</button>
    </div>
    <button type="button" class="bell chamfer" id="bell" aria-pressed="false" title="Play a sound and notify when the work is done">◈ <span class="lbl">Notify when done</span></button>
  </div>
  <div class="stabs" id="tabs" role="tablist" aria-label="Claude Code sessions"></div>
  <div class="attention" id="attention" aria-live="polite"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="tip" id="tip" role="tooltip"></div>
  <div class="switching" id="switching" aria-live="polite"><div><b id="sw-title"></b><span id="sw-text"></span></div></div>
  <div class="mapbar"><button type="button" class="donechip chamfer" id="donechip" hidden></button><button type="button" class="donechip chamfer" id="resetpins" hidden>Reset layout</button></div>
  <div class="empty" id="empty"><div>
    <p>No agents to show yet</p>
    <p>In Claude Code, run <code>/agent-flow web</code>. This map fills in as agents start, hand off work and report back.</p>
    <p>Want to see it move first? <a href="?demo">Play the demo run</a>.</p>
  </div></div>
</main>
<aside aria-label="Session details">
  <section class="mission" aria-live="polite"><div class="plate chamfer" id="plate"><div class="chamfer" id="plate-in"></div></div></section>
  <section aria-labelledby="h-agents">
    <h2 id="h-agents">Agents</h2>
    <ul class="agents" id="agents"></ul>
  </section>
  <section id="agent"></section>
  <section aria-labelledby="h-wire">
    <h2 id="h-wire">Every hand-off</h2>
    <ul class="wire" id="wire"></ul>
  </section>
</aside>
<div class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="d-title"></div>

<script>
'use strict'
const NEON = ['#00F0FF', '#FF2BD6', '#39FF14', '#FFE600', '#B026FF', '#FF8A00', '#FF3864', '#00FFA3']
const MAIN = 'main'
const MAIN_TURN = '(main turn)'
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches
const DEMO = new URLSearchParams(location.search).has('demo') || window.__AF_DEMO === true
/** The session whose tab is open: its data is read from s/<id>/. */
let active = null
const QUIET_MS = 45000
const IMPACT_MS = 1100
const pageStart = Date.now()
const KIND_COLOR = { prompt: '#F3E600', user: '#00E5FF', reply: '#FF2E88', call: '#B48CFF', result: '#3DFF8F', error: '#FF3355' }
const KIND_NAME = { prompt: 'The task it was handed', user: 'Your messages', reply: 'What it wrote', call: 'Its tool calls', result: 'Tool results', error: 'Tool errors' }
const PACKET_NAME = { spawn: 'Task handed over', report: 'Report back', message: 'Direct message' }

const $ = id => document.getElementById(id)
const fmt = n => n < 1000 ? String(Math.round(n)) : n < 1e6 ? (n / 1000).toFixed(n < 1e4 ? 1 : 0).replace(/\.0$/, '') + 'k' : (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M'
const clip = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length <= n ? s : s.slice(0, Math.max(1, n - 1)) + '…' }
const colorOf = a => a.status === 'error' ? '#FF3864' : NEON[((a.color % NEON.length) + NEON.length) % NEON.length]
const rgb = hex => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]
const rgba = (hex, a) => { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})` }
const dur = ms => { const s = Math.max(0, Math.round(ms / 1000)); if (s < 60) return s + 's'; const m = Math.floor(s / 60); if (m < 60) return m + 'm ' + String(s % 60).padStart(2, '0') + 's'; return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm' }
const clock = ms => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
const ago = ms => ms < 1500 ? 'just now' : dur(ms) + ' ago'
const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)); const m = Math.floor(s / 60); return (m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') : m) + ':' + String(s % 60).padStart(2, '0') }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]) }
const setHtml = (el, html) => { if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; return true } return false }

// ---------- data ----------
let graph = null
let durations = {}
let lastPush = 0
let selected = MAIN
let userSelected = false
let view = 'map'
let tab = 'overview'
const burn = {} // per agent: [{t, v}] its writing speed over time
const packets = new Map() // link id → full packet
let contexts = { agents: {}, main: null }
let packetsRev = -1, ctxRev = -1

window.__AF_PUSH = payload => {
  if (!payload || !payload.graph || (payload.sid && payload.sid !== active)) return
  graph = payload.graph
  durations = payload.history || durations
  lastPush = Date.now()
  $('switching').classList.remove('show')
  const t = payload.now || lastPush
  for (const id of graph.order) {
    const a = graph.agents[id]; if (!a) continue
    const h = burn[id] || (burn[id] = [])
    const v = a.status === 'running' ? (a.tps || 0) : 0
    if (!h.length || t - h[h.length - 1].t >= 250) h.push({ t, v })
    if (h.length > 1200) h.splice(0, h.length - 1200)
  }
  const rev = payload.rev || {}
  if (!DEMO && rev.packets !== undefined && rev.packets !== packetsRev) load(base() + 'packets.js')
  if (!DEMO && rev.ctx !== undefined && rev.ctx !== ctxRev) load(base() + 'context.js')
  railSoon()
}
/** Pushes come ten times a second; the rail is text to read, so it redraws at most four. */
let railTimer = null, railAt = 0
function railSoon() {
  if (railTimer) return
  const wait = Math.max(0, 250 - (Date.now() - railAt))
  railTimer = setTimeout(() => { railTimer = null; railAt = Date.now(); renderRail() }, wait)
}
window.__AF_PACKETS = data => {
  if (!data || (data.sid && data.sid !== active)) return
  packetsRev = data.rev
  for (const p of data.items || []) packets.set(p.id, p)
  railSoon()
  if (openPacket !== null) renderDrawer()
}
window.__AF_CTX = data => {
  if (!data || (data.sid && data.sid !== active)) return
  ctxRev = data.rev
  contexts = { agents: data.agents || {}, main: data.main || null }
  railSoon()
}

// ---------- sessions: one tab per Claude Code session ----------
// sessions.js lists them (each session adds itself); s/<id>/meta.js says what each is doing, written by that session alone.
let sessionList = []
const metas = {}
const seenState = {} // what each tab last showed, to notice a background session finishing
const pinged = new Set() // tabs that finished while you were on another one
const base = () => (active ? 's/' + encodeURIComponent(active) + '/' : '')
const LIVE_MS = 15000

window.__AF_SESSIONS = data => {
  if (!data || !Array.isArray(data.sessions)) return
  sessionList = data.sessions.filter(x => x && typeof x.id === 'string')
  if (!active || !sessionList.some(x => x.id === active)) {
    const want = (location.hash.match(/s=([^&]+)/) || [])[1]
    const pick = sessionList.find(x => x.id === decodeURIComponent(want || '')) || sessionList.slice().sort((x, y) => (y.lastSeen || 0) - (x.lastSeen || 0))[0]
    if (pick && pick.id !== active) openSession(pick.id)
  }
  renderTabs()
}
window.__AF_META = m => {
  if (!m || !m.id) return
  noteMeta(m)
}
function noteMeta(m) {
  const prev = seenState[m.id]
  metas[m.id] = m
  if (prev === 'running' && (m.state === 'done' || m.state === 'failed') && m.id !== active) {
    pinged.add(m.id)
    announce(`${m.project || 'A session'} is done${m.failed ? `, ${m.failed} agent${m.failed > 1 ? 's' : ''} failed` : ''}`, m.failed > 0)
  }
  seenState[m.id] = m.state
  renderTabs()
}

function openSession(id) {
  if (id === active) return
  active = id
  pinged.delete(id)
  // a different session: start the page over on its data
  graph = null; lastPush = 0; lastState = null; selected = MAIN
  packets.clear(); contexts = { agents: {}, main: null }; packetsRev = -1; ctxRev = -1
  for (const k of Object.keys(burn)) delete burn[k]
  for (const k of Object.keys(nodes)) delete nodes[k]
  for (const k of Object.keys(loading)) loading[k] = false
  closeDrawer()
  for (const el of [$('agents'), $('agent'), $('wire'), $('plate-in')]) { el.innerHTML = ''; el.dataset.html = '' }
  try { history.replaceState(null, '', '#s=' + encodeURIComponent(id)) } catch {}
  loadPins(); $('resetpins').hidden = !Object.keys(pins).length
  if (DEMO) demoShow(id)
  else { load(base() + 'state.js'); load(base() + 'packets.js'); load(base() + 'context.js') }
  renderTabs()
  // say what is happening until the session's data arrives, and what to do if it never does
  const x = sessionList.find(s => s.id === id)
  const name = (metas[id] && metas[id].project) || (x && x.project) || 'this session'
  $('sw-title').textContent = 'Loading ' + name + '…'
  $('sw-text').textContent = ''
  $('switching').classList.add('show')
  clearTimeout(openSession.timer)
  openSession.timer = setTimeout(() => {
    if (active !== id || lastPush) return
    $('sw-title').textContent = 'No data from ' + name
    $('sw-text').textContent = 'That session is closed or still runs an older version of the mod. In it, run /reload-plugins and then /agent-flow web.'
  }, 3000)
}

function tabFacts(x, now) {
  const m = metas[x.id] || {}
  const live = now - (m.lastSeen || x.lastSeen || 0) < LIVE_MS
  if (!live) return { cls: 'closed', text: 'closed' }
  if (m.state === 'running') {
    const subs = m.running || 0
    return { cls: 'running', text: `${mmss(now - (m.turnStart || now))}${subs ? `, ${subs} agent${subs > 1 ? 's' : ''}` : ''}` }
  }
  if (m.state === 'failed') return { cls: 'failed', text: `done ${m.endedAt ? clock(m.endedAt).replace(/:\d\d(\s|$)/, '$1') : ''}, ${m.failed} failed` }
  if (m.state === 'done') return { cls: 'done', text: `done ${m.endedAt ? clock(m.endedAt).replace(/:\d\d(\s|$)/, '$1') : ''}` }
  return { cls: 'idle', text: 'idle' }
}

function renderTabs() {
  const el = $('tabs')
  if (!sessionList.length) { setHtml(el, ''); return }
  const now = Date.now()
  // live sessions first, closed ones after; buttons are only rebuilt when the set of sessions changes,
  // so a clock ticking on a tab never swaps a button out from under the pointer
  const live = x => now - ((metas[x.id] && metas[x.id].lastSeen) || x.lastSeen || 0) < LIVE_MS
  // a session closed for over half an hour leaves the bar (its folder stays on disk)
  const seen = x => (metas[x.id] && metas[x.id].lastSeen) || x.lastSeen || 0
  const list = sessionList.filter(x => x.id === active || now - seen(x) < 30 * 60000).sort((x, y) => Number(live(y)) - Number(live(x)))
  const skeleton = list.map(x => `<button type="button" role="tab" class="stab" data-sid="${esc(x.id)}"><i></i><span class="nm"></span><span class="sub"></span></button>`).join('')
  setHtml(el, skeleton)
  for (const b of el.querySelectorAll('button[data-sid]')) {
    const x = sessionList.find(s => s.id === b.dataset.sid); if (!x) continue
    const f = tabFacts(x, now)
    const name = (metas[x.id] && metas[x.id].project) || x.project || 'session'
    const cls = `stab ${f.cls}${pinged.has(x.id) ? ' ping' : ''}`
    if (b.className !== cls) b.className = cls
    const sel = String(x.id === active)
    if (b.getAttribute('aria-selected') !== sel) b.setAttribute('aria-selected', sel)
    if (b.children[1].textContent !== name) b.children[1].textContent = name
    if (b.children[2].textContent !== f.text) b.children[2].textContent = f.text
    const title = x.cwd || name
    if (b.title !== title) b.title = title
  }
}

/** A session in another tab finished: say so, and ring if asked to. */
function announce(text, bad) {
  const t = $('toast')
  t.textContent = text
  t.className = 'toast show' + (bad ? ' bad' : '')
  clearTimeout(announce.timer)
  announce.timer = setTimeout(() => { t.className = 'toast' }, 6000)
  chime()
  try {
    if (bellOn && 'Notification' in window && Notification.permission === 'granted' && document.hidden) new Notification('AGENT//FLOW', { body: text })
  } catch {}
}

const loading = {}
function load(file) {
  if (loading[file]) return
  loading[file] = true
  const s = document.createElement('script')
  s.src = file + '?t=' + Date.now()
  const done = () => { s.remove(); loading[file] = false }
  s.onload = done
  s.onerror = done
  document.head.appendChild(s)
}

/** A loop the map never learned anything about (no name, no tokens, no tools) is noise: left out. */
function inert(a) {
  return a && a.id !== MAIN && a.type === 'agent' && !a.inTok && !a.outTok && !a.tools && !(a.liveOut > 0)
}

function treeOrder(g) {
  const out = []
  const seen = new Set()
  const walk = (id, depth) => {
    if (seen.has(id) || depth > 12) return
    seen.add(id)
    if (inert(g.agents[id])) return
    out.push({ id, depth })
    for (const c of g.order) if (g.agents[c] && g.agents[c].parent === id) walk(c, depth + 1)
  }
  walk(MAIN, 0)
  for (const id of g.order) if (!seen.has(id)) walk(id, 1)
  return out
}

/**
 * Finished agents step off the map: it shows what is working now. Kept: the orchestrator, running
 * and failed agents, ones that finished in the last minute, the selected one, and the parents that
 * connect them. The timeline keeps this turn's agents. "Show finished" brings everything back; nothing
 * is deleted, so their reports and packets stay one click away.
 */
const RECENT_MS = 60000
let showDone = false
function shownOrder(g, now, scope) {
  const all = treeOrder(g)
  if (showDone) return all
  const m = g.agents[MAIN]
  const turnStart = m ? m.startedAt : 0
  const keep = new Set([MAIN, selected])
  for (const { id } of all) {
    const a = g.agents[id]; if (!a) continue
    const recent = a.endedAt && now - a.endedAt < RECENT_MS
    const thisTurn = a.startedAt >= turnStart - 1000
    if (a.status === 'running' || a.status === 'error' || recent || (scope === 'timeline' && thisTurn)) keep.add(id)
  }
  for (const id of [...keep]) { let p = g.agents[id] && g.agents[id].parent; let n = 0; while (p && !keep.has(p) && n++ < 12) { keep.add(p); p = g.agents[p] && g.agents[p].parent } }
  return all.filter(x => keep.has(x.id))
}
function hiddenCount(g, now) {
  if (showDone) return 0
  return treeOrder(g).length - shownOrder(g, now, 'map').length
}
function toggleDone() {
  showDone = !showDone
  try { localStorage.setItem('agent-flow-done', showDone ? '1' : '') } catch {}
  for (const el of [$('agents')]) el.dataset.html = ''
  renderRail()
}

/** What deserves the developer's eyes now: failures, and running agents gone quiet. */
function attentionItems(g, now) {
  const items = []
  for (const id of g.order) {
    const a = g.agents[id]; if (!a || inert(a)) continue
    if (a.status === 'error') items.push({ id, kind: 'error', text: `${a.label} failed` })
    else if (a.status === 'running' && a.lastActiveAt && now - a.lastActiveAt > QUIET_MS && !a.activity)
      items.push({ id, kind: 'quiet', text: `${a.label} has been quiet for ${dur(now - a.lastActiveAt)}` })
    else if (a.status === 'running' && a.activity && a.toolLog && a.toolLog.length) {
      const last = a.toolLog[a.toolLog.length - 1]
      if (last && last.end === undefined && now - last.at > QUIET_MS)
        items.push({ id, kind: 'quiet', text: `${a.label} has waited ${dur(now - last.at)} on ${clip(last.text, 40)}` })
    }
  }
  return items
}

// ---------- "when is it done" ----------
function progressOf(a) {
  const list = (a && a.todos) || []
  const cur = list.find(t => t.status === 'in_progress')
  return { done: list.filter(t => t.status === 'completed').length, total: list.length, current: cur ? (cur.active || cur.text) : null }
}

/** How long runs like this usually take, from finished ones: null until there are three. */
function usual(key) {
  const list = (durations[key] || []).filter(x => x > 0).slice().sort((x, y) => x - y)
  if (list.length < 3) return null
  const q = p => list[Math.min(list.length - 1, Math.floor(p * (list.length - 1) + 0.5))]
  return { median: q(0.5), p80: q(0.8), n: list.length }
}

/** An agent's own estimate line: from its plan when it has one, else from how long its kind usually takes. */
function etaOf(a, now) {
  if (!a) return null
  const p = progressOf(a)
  const key = a.id === MAIN ? MAIN_TURN : a.type
  const u = usual(key)
  const running = a.status === 'running'
  const elapsed = (a.endedAt || now) - a.startedAt
  if (!running) return { frac: a.status === 'done' || (a.id === MAIN && a.endedAt) ? 1 : null, plan: p, u, elapsed, text: null }
  let text = null, frac = null, estimate = false
  if (p.total) frac = p.done / p.total
  if (u) {
    const left = u.median - elapsed
    if (left > 0) text = `<b>About ${dur(left)} left</b>, judging by ${u.n} earlier ${a.id === MAIN ? 'turns' : esc(a.type) + ' runs'} (usually ${dur(u.median)})`
    else if (elapsed <= u.p80) text = `<b>Should finish soon</b>: ${a.id === MAIN ? 'turns' : esc(a.type) + ' runs'} usually take ${dur(u.median)}`
    else text = `<b>Running longer than usual</b>: ${dur(elapsed)} so far, usually ${dur(u.median)}`
    if (frac === null) { frac = Math.min(0.97, elapsed / Math.max(1, u.median)); estimate = true }
  } else if (!p.total) {
    text = `No estimate yet: it needs three finished ${a.id === MAIN ? 'turns' : esc(a.type) + ' runs'} to compare with`
  }
  return { frac, estimate, plan: p, u, elapsed, text }
}

function mission(g, now) {
  const m = g.agents[MAIN]
  const turnStart = m ? m.startedAt : g.startedAt
  const inTurn = g.order.map(id => g.agents[id]).filter(a => a && !inert(a) && a.id !== MAIN && a.startedAt >= turnStart - 1000)
  const running = g.order.map(id => g.agents[id]).filter(a => a && !inert(a) && a.status === 'running')
  const failed = inTurn.filter(a => a.status === 'error')
  const done = inTurn.filter(a => a.status === 'done')
  let state = 'idle'
  if (running.length) state = 'running'
  else if (m && m.endedAt) state = failed.length ? 'failed' : 'done'
  // the plan: main's if it has one, else every agent's together
  let plan = progressOf(m)
  if (!plan.total) {
    const all = g.order.flatMap(id => (g.agents[id] && g.agents[id].todos) || [])
    const cur = all.find(t => t.status === 'in_progress')
    plan = { done: all.filter(t => t.status === 'completed').length, total: all.length, current: cur ? (cur.active || cur.text) : null }
  }
  return { state, m, turnStart, inTurn, running, failed, done, plan }
}

// ---------- canvas ----------
const canvas = $('c')
const ctx = canvas.getContext('2d')
let W = 0, H = 0, DPR = 1
let backdrop = null
const sprites = {}
let numFont = 'monospace', displayFont = 'sans-serif'

function resize() {
  const r = canvas.getBoundingClientRect()
  DPR = Math.min(2, window.devicePixelRatio || 1)
  W = Math.max(1, r.width)
  H = Math.max(1, r.height)
  canvas.width = Math.round(W * DPR)
  canvas.height = Math.round(H * DPR)
  backdrop = makeBackdrop()
}

/** The room: violet dark, a perspective grid floor, faint data dust. Drawn once per size. */
function makeBackdrop() {
  const c = document.createElement('canvas')
  c.width = canvas.width
  c.height = canvas.height
  const g = c.getContext('2d')
  g.scale(DPR, DPR)
  g.fillStyle = '#0a0614'
  g.fillRect(0, 0, W, H)
  const sky = g.createRadialGradient(W * 0.5, H * 0.1, 0, W * 0.5, H * 0.1, Math.hypot(W, H) * 0.75)
  sky.addColorStop(0, 'rgba(90, 30, 150, 0.30)')
  sky.addColorStop(0.6, 'rgba(40, 10, 80, 0.12)')
  sky.addColorStop(1, 'rgba(0,0,0,0)')
  g.fillStyle = sky
  g.fillRect(0, 0, W, H)
  // grid floor
  const horizon = H * 0.62
  const vx = W * 0.5
  g.save()
  g.beginPath(); g.rect(0, horizon, W, H - horizon); g.clip()
  const fade = g.createLinearGradient(0, horizon, 0, H)
  fade.addColorStop(0, 'rgba(255,46,136,0)')
  fade.addColorStop(1, 'rgba(255,46,136,0.20)')
  g.strokeStyle = fade
  g.lineWidth = 1
  for (let k = -24; k <= 24; k++) {
    g.beginPath(); g.moveTo(vx + k * 6, horizon); g.lineTo(vx + k * W * 0.16, H); g.stroke()
  }
  for (let k = 1; k < 14; k++) {
    const y = horizon + (H - horizon) * Math.pow(k / 13, 2.2)
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke()
  }
  g.restore()
  g.fillStyle = 'rgba(180, 140, 255, 0.09)'
  for (let y = 18; y < horizon; y += 30) for (let x = 18; x < W; x += 30) g.fillRect(x, y, 1.3, 1.3)
  return c
}

function sprite(hex) {
  if (sprites[hex]) return sprites[hex]
  const s = document.createElement('canvas')
  s.width = s.height = 128
  const g = s.getContext('2d')
  const [r, gg, b] = rgb(hex)
