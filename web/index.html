    }
  } else {
    ctx.beginPath(); ctx.arc(x, y, R1, 0, Math.PI * 2)
    ctx.lineWidth = 1; ctx.strokeStyle = rgba(c, 0.22); ctx.stroke()
  }
  // its plan, as an arc filling on the tick ring
  if (p.total) {
    ctx.save(); ctx.lineCap = 'round'
    ctx.beginPath(); ctx.arc(x, y, R2 - 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (p.done / p.total))
    ctx.lineWidth = 2.6; ctx.strokeStyle = rgba('#F3E600', 0.95); ctx.shadowColor = '#F3E600'; ctx.shadowBlur = 8; ctx.stroke()
    ctx.restore()
  }
  if (selected === a.id) brackets(x, y, r + 30, '#FFFFFF', 0.85)
  else if (hoverId === a.id) brackets(x, y, r + 30, '#FFFFFF', 0.35)

  // the task's icon in the middle
  icon(taskIcon(a), x, y, r * 0.52, running ? '#ffffff' : c, running ? 0.95 : 0.8)
  // a badge on the rim: the tool running now, or how it ended
  const bx = x + r * 0.72, by = y + r * 0.72, br = Math.max(7, r * 0.3)
  const badge = (fill, edge) => {
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2)
    ctx.fillStyle = fill; ctx.fill()
    ctx.lineWidth = 1.5; ctx.strokeStyle = edge; ctx.shadowColor = edge; ctx.shadowBlur = 8; ctx.stroke(); ctx.shadowBlur = 0
  }
  if (running && a.activity) {
    badge('rgba(10,6,20,0.95)', c)
    icon(toolIcon(a.activity), bx, by, br * 0.62, partner(c), 1)
  } else if (a.status === 'error') {
    badge('rgba(60,8,20,0.95)', '#FF3355')
    ctx.fillStyle = '#ffd0d8'; ctx.font = `700 ${br * 1.2}px ${displayFont}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', bx, by + 1)
  } else if (finished) {
    badge('rgba(10,6,20,0.95)', rgba(c, 0.8))
    ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = 1.8; ctx.lineCap = 'round'
    ctx.beginPath(); ctx.moveTo(bx - br * 0.4, by); ctx.lineTo(bx - br * 0.1, by + br * 0.32); ctx.lineTo(bx + br * 0.42, by - br * 0.32); ctx.stroke(); ctx.restore()
  }

  // labels under the rings
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  const narrow = (n.slot || 200) < 130
  const room = Math.max(8, Math.floor((n.slot || 200) / (narrow ? 7.4 : 7.6)) - 2)
  let ly = y + r + 38
  ctx.font = `600 ${narrow ? 13 : 15.5}px ${displayFont}`
  ctx.fillStyle = c
  ctx.fillText(clip(a.label, room), x, ly)
  ly += narrow ? 16 : 19
  if (a.isProcess) {
    const elapsed = Math.round(((a.endedAt || t) - a.startedAt) / 1000) + 's'
    ctx.textAlign = 'center'
    ctx.font = `500 ${narrow ? 10.5 : 12}px ${numFont}`
    ctx.fillStyle = '#8888aa'
    ctx.fillText(elapsed, x, ly)
  } else {
    const inT = fmt(a.inTok), outT = fmt(a.outTok + Math.round(a.liveOut || 0))
    ctx.font = `500 ${narrow ? 10.5 : 12}px ${numFont}`
    const sep = narrow ? ' / ' : '  /  '
    const extra = (running && a.tps > 0 ? `  ${Math.round(a.tps)} tok/s` : '') + (p.total ? `  ${p.done}/${p.total}` : '')
    const wIn = ctx.measureText(inT).width, wSep = ctx.measureText(sep).width, wOut = ctx.measureText(outT).width, wEx = ctx.measureText(extra).width
    let lx = x - (wIn + wSep + wOut + wEx) / 2
    ctx.textAlign = 'left'
    ctx.fillStyle = '#7fe7ff'; ctx.fillText(inT, lx, ly); lx += wIn
    ctx.fillStyle = '#5b5285'; ctx.fillText(sep, lx, ly); lx += wSep
    ctx.fillStyle = '#ff9bc8'; ctx.fillText(outT, lx, ly); lx += wOut
    if (extra) { ctx.fillStyle = '#f3e600'; ctx.fillText(extra, lx, ly) }
    ctx.textAlign = 'center'
  }
  ly += narrow ? 15 : 18
  ctx.font = `500 ${narrow ? 11.5 : 13}px ${displayFont}`
  ctx.fillStyle = a.activity ? '#e2dbff' : '#9188bc'
  // when the name already is its task, the last line says how it is going instead of repeating it
  const named = a.role && a.role.startsWith(a.label.replace(/(…| #\d+)+$/, ''))
  const how = a.status === 'done' ? 'done in ' + dur((a.endedAt || t) - a.startedAt) : a.status === 'error' ? 'failed' : running ? 'working' : a.role
  const toolTimer = a.activeStartedAt ? ` [${dur(t - a.activeStartedAt)}]` : ''
  const actText = a.activity ? `${a.activity}${toolTimer}` : (p.current && running ? p.current : named ? how : a.role)
  ctx.fillText(clip(actText, room + 8), x, ly)
}

function comet(b, color, p, l, tags) {
  const head = ease(p)
  ctx.lineCap = 'round'
  strokeBezier(b, color, 2.4, 0.55, Math.max(0, head - 0.35), head)
  ctx.globalCompositeOperation = 'lighter'
  if (!REDUCED) for (let i = 16; i >= 1; i--) {
    const q = at(b, Math.max(0, head - i * 0.014))
    glow(q.x, q.y, 9 - i * 0.35, color, 0.55 * (1 - i / 17))
  }
  const h = at(b, head)
  glow(h.x, h.y, 34, color, 0.75)
  glow(h.x, h.y, 12, color, 1)
  glow(h.x, h.y, 6, '#FFFFFF', 1)
  ctx.globalCompositeOperation = 'source-over'
  const sym = l.kind === 'spawn' ? '↓' : l.kind === 'report' ? '↑' : '✉'
  tags.push({ x: h.x + 16, y: h.y - 12, s: `${sym} ${fmt(l.tokens)} tok`, c: color, a: Math.min(1, p * 5) })
}

function burst(n, color, p, l, tags) {
  ctx.globalCompositeOperation = 'lighter'
  glow(n.x, n.y, n.r * 2.4, color, 0.9 * Math.max(0, 1 - p * 2.5))
  ctx.globalCompositeOperation = 'source-over'
  for (const [lag, w, col] of [[0, 3, color], [0.14, 1.5, '#FFFFFF']]) {
    const q = Math.max(0, p - lag)
    if (q <= 0) continue
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 4 + q * 46, 0, Math.PI * 2)
    ctx.lineWidth = w; ctx.strokeStyle = col === '#FFFFFF' ? `rgba(255,255,255,${0.8 * (1 - q) ** 2})` : rgba(col, (1 - q) ** 2)
    ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.stroke(); ctx.shadowBlur = 0
  }
  tags.push({ x: n.x + n.r + 14, y: n.y - n.r - 6 - p * 30, s: `+${fmt(l.tokens)} tok`, c: color, a: 1 - p * p })
}

// ---------- timeline view ----------
let lanes = []
let ticks = []
let dots = []

function niceStep(spanMs, px) {
  const steps = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600].map(s => s * 1000)
  for (const s of steps) if ((s / spanMs) * px >= 90) return s
  return 3600000
}

function drawTimeline(g, t) {
  const top = topOffset() + 10
  const LEFT = Math.min(240, Math.max(150, W * 0.2))
  const RIGHT = 28
  const order = shownOrder(g, t, 'timeline')
  const t0 = Math.min(...order.map(({ id }) => g.agents[id]?.startedAt ?? t), t - 5000)
  const t1 = t + Math.max(2000, (t - t0) * 0.04)
  const span = Math.max(5000, t1 - t0)
  const plotW = Math.max(50, W - LEFT - RIGHT)
  const X = ms => LEFT + ((ms - t0) / span) * plotW
  const laneH = Math.max(32, Math.min(78, (H - top - 50) / Math.max(1, order.length)))
  lanes = []; ticks = []; dots = []

  ctx.fillStyle = 'rgba(10,6,20,0.72)'
  ctx.fillRect(0, top - 18, W, order.length * laneH + 44)

  const step = niceStep(span, plotW)
  ctx.font = `500 11px ${numFont}`
  ctx.textAlign = 'center'; ctx.textBaseline = 'top'
  for (let s = 0; t0 + s <= t1; s += step) {
    const x = X(t0 + s)
    ctx.fillStyle = 'rgba(145,136,188,0.12)'
    ctx.fillRect(x, top - 6, 1, order.length * laneH + 6)
    ctx.fillStyle = '#5b5285'
    ctx.fillText(mmss(s), x, top + order.length * laneH + 6)
  }

  let peak = 1
  const rates = {}
  for (const { id } of order) {
    const a = g.agents[id]
    const r = (burn[id] || []).filter(p => p.t >= (a?.startedAt ?? 0) - 500)
    rates[id] = r
    for (const p of r) peak = Math.max(peak, p.v)
  }

  order.forEach(({ id, depth }, i) => {
    const a = g.agents[id]; if (!a) return
    const c = colorOf(a)
    const y = top + i * laneH
    const mid = y + laneH / 2
    const start = a.startedAt ?? t0
    const end = a.endedAt ?? (a.status === 'running' ? t : a.lastActiveAt ?? t)
    const x0 = X(start), x1 = Math.max(X(end), x0 + 3)
    const barH = Math.min(36, laneH - 14)
    lanes.push({ id, y, h: laneH, x0, x1 })

    if (selected === id) { ctx.fillStyle = 'rgba(0,229,255,0.05)'; ctx.fillRect(0, y, W, laneH) }

    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'
    ctx.font = `600 14px ${displayFont}`
    ctx.fillStyle = c
    ctx.fillText(clip(a.label, 22), 16 + depth * 12, mid - 7)
    ctx.font = `500 11px ${numFont}`
    ctx.fillStyle = a.status === 'running' ? '#3dff8f' : a.status === 'error' ? '#ff3355' : '#9188bc'
    const p = progressOf(a)
    const st = a.status === 'running' ? 'running ' + dur(t - start) : a.status === 'done' || (id === MAIN && a.endedAt) ? 'done in ' + dur(end - start) : a.status
    ctx.fillText(st + (p.total ? `  ${p.done}/${p.total}` : ''), 16 + depth * 12, mid + 9)

    // the expected finish, as a ghost extension of a running bar
    const e = a.status === 'running' ? usual(id === MAIN ? MAIN_TURN : a.type) : null
    if (e && start + e.median > t) {
      ctx.save(); ctx.setLineDash([3, 4]); ctx.strokeStyle = rgba(c, 0.45); ctx.lineWidth = 1
      ctx.strokeRect(x1, mid - barH / 2, Math.max(2, X(start + e.median) - x1), barH)
      ctx.restore()
    }

    ctx.fillStyle = rgba(c, a.status === 'running' ? 0.16 : 0.10)
    ctx.fillRect(x0, mid - barH / 2, x1 - x0, barH)
    ctx.strokeStyle = rgba(c, a.status === 'running' ? 0.8 : 0.45); ctx.lineWidth = 1.2
    ctx.strokeRect(x0 + 0.5, mid - barH / 2 + 0.5, x1 - x0 - 1, barH - 1)

    const r = rates[id]
    if (r.length > 1) {
      ctx.save()
      ctx.beginPath(); ctx.rect(x0, mid - barH / 2, x1 - x0, barH); ctx.clip()
      const base = mid + barH / 2 - 6
      const Y = v => base - (v / peak) * (barH - 9)
      ctx.beginPath()
      ctx.moveTo(X(r[0].t), base)
      for (const q of r) ctx.lineTo(X(q.t), Y(q.v))
      ctx.lineTo(X(r[r.length - 1].t), base)
      ctx.closePath()
      ctx.fillStyle = rgba(c, 0.30); ctx.fill()
      ctx.beginPath()
      r.forEach((q, k) => (k ? ctx.lineTo(X(q.t), Y(q.v)) : ctx.moveTo(X(q.t), Y(q.v))))
      ctx.strokeStyle = rgba(c, 0.95); ctx.lineWidth = 1.4; ctx.stroke()
      ctx.restore()
    }

    for (const tl of a.toolLog || []) {
      const tx0 = X(tl.at), tx1 = Math.max(tx0 + 3, X(tl.end ?? t) - 1.5)
      const ty = mid + barH / 2 - 4
      ctx.fillStyle = tl.end === undefined ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.45)'
      ctx.fillRect(tx0, ty, tx1 - tx0, 2)
      ctx.fillStyle = 'rgba(255,255,255,0.9)'
      ctx.fillRect(tx0, ty - 4, 1.5, 6)
      ticks.push({ id, x0: tx0 - 2, x1: tx1 + 2, y0: ty - 7, y1: ty + 5, tool: tl })
    }

    if (a.status === 'running') {
      ctx.globalCompositeOperation = 'lighter'
      glow(x1, mid, REDUCED ? 10 : 10 + 3 * Math.sin(t / 220), c, 0.9)
      ctx.globalCompositeOperation = 'source-over'
    }
  })

  const laneOf = {}
  for (const l of lanes) laneOf[l.id] = l
  for (const l of g.links) {
    const A = laneOf[l.from], B = laneOf[l.to]
    if (!A || !B) continue
    const x = X(l.at)
    const ya = A.y + A.h / 2, yb = B.y + B.h / 2
    const c = l.kind === 'message' ? '#FF2E88' : g.agents[l.from] ? colorOf(g.agents[l.from]) : '#fff'
    ctx.save()
    if (l.kind === 'message') ctx.setLineDash([3, 4])
    ctx.strokeStyle = rgba(c, 0.6); ctx.lineWidth = 1.2
    ctx.beginPath(); ctx.moveTo(x, ya); ctx.lineTo(x, yb); ctx.stroke()
    ctx.restore()
    ctx.fillStyle = c
    ctx.save(); ctx.translate(x, yb); ctx.rotate(Math.PI / 4); ctx.fillRect(-3.5, -3.5, 7, 7); ctx.restore()
    dots.push({ x, y: yb, link: l })
    const fresh = t - l.at
    if (fresh >= 0 && fresh < 1200 && !REDUCED) {
      ctx.globalCompositeOperation = 'lighter'
      glow(x, ya + (yb - ya) * Math.min(1, fresh / 500), 14, c, 1 - fresh / 1200)
      ctx.globalCompositeOperation = 'source-over'
    }
  }

  const xn = X(t)
  ctx.save(); ctx.setLineDash([4, 5]); ctx.strokeStyle = 'rgba(0,229,255,0.5)'
  ctx.beginPath(); ctx.moveTo(xn, top - 10); ctx.lineTo(xn, top + order.length * laneH); ctx.stroke(); ctx.restore()
  ctx.font = `600 11px ${numFont}`; ctx.fillStyle = '#00e5ff'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'
  ctx.fillText('now', xn, top - 12)
}

// ---------- frame ----------
let frameDt = 16
function frame(now) {
  requestAnimationFrame(frame)
  frameDt = Math.min(64, now - lastFrame)
  lastFrame = now
  if (!W) return
  const t = Date.now()
  const g = graph
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
  ctx.drawImage(backdrop, 0, 0, W, H)
  const m0 = g && g.agents[MAIN]
  $('empty').classList.toggle('show', !g || (g.order.length <= 1 && g.links.length === 0 && !(m0 && (m0.steps || m0.status === 'running'))))
  updateConn(t)
  if (!g) return
  if (view === 'map') drawMap(g, t)
  else drawTimeline(g, t)
}

function updateConn(t) {
  const el = $('conn')
  const fresh = t - lastPush < 3000
  el.className = 'conn ' + (DEMO ? 'demo' : fresh ? 'live' : '')
  const text = DEMO ? 'Demo' : fresh ? 'Live' : lastPush ? 'No updates' : 'Waiting'
  if (el.lastChild.textContent !== text) el.lastChild.textContent = text
}

// ---------- the mission plate ----------
let lastState = null
let bellOn = false
let audio = null

function renderMission(g, now) {
  const M = mission(g, now)
  const plate = $('plate')
  const word = { running: 'RUNNING', done: 'DONE', failed: 'DONE', idle: 'STANDBY' }[M.state]
  let html = ''
  const counts = `<div class="counts">
    <div><b>${M.running.filter(a => a.id !== MAIN).length}</b><span>running</span></div>
    <div><b>${M.done.length}</b><span>finished</span></div>
    <div><b>${M.failed.length}</b><span>failed</span></div>
    <div><b>${fmt(g.order.reduce((s, id) => s + (g.agents[id] ? g.agents[id].outTok + (g.agents[id].liveOut || 0) : 0), 0))}</b><span>tokens written</span></div>
  </div>`
  if (M.state === 'running') {
    const e = etaOf(M.m && M.m.status === 'running' ? M.m : M.running[0], now)
    const planLine = M.plan.total ? `<p class="step"><b>${M.plan.done} of ${M.plan.total} steps done</b>${M.plan.current ? '. Now: ' + esc(M.plan.current) : ''}</p>` : ''
    const frac = M.plan.total ? M.plan.done / M.plan.total : e && e.frac !== null ? e.frac : null
    const subs = M.running.filter(a => a.id !== MAIN)
    // the run ends when its slowest agent does: name the one expected last
    let last = null
    for (const a of subs) {
      const u = usual(a.type)
      if (!u) continue
      const left = u.median - (now - a.startedAt)
      if (!last || left > last.left) last = { a, left }
    }
    const activeSub = subs.find(a => a.activity || a.activeDetail) || subs[0]
    const liveActivity = activeSub && (activeSub.activity || activeSub.activeDetail) ? `
      <div class="mission-live" onclick="select('${esc(activeSub.id)}')">
        <div class="mission-live-row">
          <span class="live-dot"></span>
          <b style="color:${colorOf(activeSub)}">${esc(activeSub.label)}</b>
          <span>${esc(activeSub.activeTool ? `${activeSub.activeTool}:` : 'doing')}</span>
          <code>${esc(activeSub.activeDetail || activeSub.activity || 'working')}</code>
          ${activeSub.activeStartedAt ? `<span class="time-tag">⏱ ${dur(now - activeSub.activeStartedAt)}</span>` : ''}
        </div>
      </div>` : ''
    html = `<div class="state"><span class="word">${word}</span><span class="clockv">${mmss(now - M.turnStart)}</span></div>
      ${planLine}
      ${frac !== null ? `<div class="bar${M.plan.total ? '' : ' est'}"><i style="width:${Math.round(Math.min(1, frac) * 100)}%"></i></div>` : ''}
      <p class="line soft">${e && e.text ? e.text : 'Started ' + clock(M.turnStart)}</p>
      ${last ? `<p class="line soft">Waiting longest on <b style="color:${colorOf(last.a)}">${esc(last.a.label)}</b>: ${last.left > 0 ? 'about ' + dur(last.left) + ' left' : 'past its usual time'}</p>` : ''}
      ${liveActivity}
      ${counts}`
  } else if (M.state === 'done' || M.state === 'failed') {
    const took = M.m.endedAt - M.turnStart
    html = `<div class="state"><span class="word">${word}</span><span class="clockv">${clock(M.m.endedAt)}</span></div>
      <p class="line">Finished after ${dur(took)}. Claude is waiting for you.</p>
      ${M.failed.length ? `<p class="line soft" style="color:#ffb3c2">${M.failed.length} agent${M.failed.length > 1 ? 's' : ''} failed: ${M.failed.map(a => esc(a.label)).join(', ')}</p>` : ''}
      ${M.plan.total ? `<p class="line soft">${M.plan.done} of ${M.plan.total} planned steps done</p>` : ''}
      ${counts}`
  } else {
    html = `<div class="state"><span class="word">${word}</span></div>
      <p class="line soft">Nothing running. Give Claude a task and the run shows up here: how far along it is and when it should be done.</p>`
  }
  plate.className = 'plate chamfer ' + M.state + (plate.classList.contains('flash') ? ' flash' : '')
  setHtml($('plate-in'), html)

  if (lastState === 'running' && (M.state === 'done' || M.state === 'failed')) finished(M)
  lastState = M.state
  const am = active && (metas[active] || sessionList.find(x => x.id === active))
  const name = am && am.project ? am.project + ' · AGENT//FLOW' : 'AGENT//FLOW'
  const want = M.state === 'running' ? `▶ ${mmss(now - M.turnStart)} · ${name}` : M.state === 'done' ? `✓ Done · ${name}` : M.state === 'failed' ? `! Done with failures · ${name}` : name
  if (document.title !== want) document.title = want
}

function finished(M) {
  const plate = $('plate')
  plate.classList.remove('flash'); void plate.offsetWidth; plate.classList.add('flash')
  setTimeout(() => plate.classList.remove('flash'), 1200)
  chime()
  try {
    if (bellOn && 'Notification' in window && Notification.permission === 'granted' && document.hidden)
      new Notification('Claude Code is done', { body: M.failed.length ? `${M.failed.length} agent(s) failed` : 'The run finished; Claude is waiting for you.' })
  } catch {}
}
function chime() {
  if (!bellOn) return
  try {
    if (audio) {
      const t = audio.currentTime
      for (const [f, d] of [[880, 0], [1320, 0.12]]) {
        const o = audio.createOscillator(), gn = audio.createGain()
        o.type = 'square'; o.frequency.value = f
        gn.gain.setValueAtTime(0.0001, t + d); gn.gain.exponentialRampToValueAtTime(0.08, t + d + 0.02); gn.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.25)
        o.connect(gn).connect(audio.destination); o.start(t + d); o.stop(t + d + 0.3)
      }
    }
  } catch {}
}
$('bell').addEventListener('click', () => {
  bellOn = !bellOn
  $('bell').setAttribute('aria-pressed', String(bellOn))
  try { localStorage.setItem('agent-flow-bell', bellOn ? '1' : '') } catch {}
  if (bellOn) {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)() ; audio.resume() } catch {}
    try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission() } catch {}
  }
})

// ---------- side rail ----------
let renderedLinks = 0
const openEntries = new Set()

function renderRail() {
  const g = graph
  if (!g) return
  const now = Date.now()
  renderMission(g, now)
  renderTabs()

  const items = attentionItems(g, now)
  setHtml($('attention'), items.map(it => `<button type="button" class="${it.kind} chamfer" data-id="${esc(it.id)}"><i></i>${esc(it.text)}</button>`).join(''))

  const order = shownOrder(g, now, 'map')
  const hidden = hiddenCount(g, now)
  const rows = order.map(({ id, depth }) => {
    const a = g.agents[id]
    if (!a) return ''
    return `<li><button type="button" data-id="${esc(id)}" aria-pressed="${selected === id}" style="padding-left:${8 + depth * 14}px">
      <span class="dot" style="background:${colorOf(a)};box-shadow:0 0 8px ${colorOf(a)}"></span>
      <span class="who">${esc(a.label)}<small>${esc(a.id === MAIN ? 'orchestrator' : a.type)}</small></span>
      <span class="st"></span></button></li>`
  }).join('')
  setHtml($('agents'), rows + (hidden || showDone ? `<li><button type="button" class="more" data-done="1">${showDone ? 'Hide finished agents' : `Show ${hidden} finished agent${hidden > 1 ? 's' : ''}`}</button></li>` : ''))
  const chip = $('donechip')
  const label = showDone ? 'Hide finished agents' : `✓ ${hidden} finished agent${hidden > 1 ? 's' : ''} off the map. Show`
  chip.hidden = !(hidden || showDone)
  if (chip.textContent !== label) chip.textContent = label
  for (const b of $('agents').querySelectorAll('button[data-id]')) {
    const a = g.agents[b.dataset.id]; if (!a) continue
    const p = progressOf(a)
    const activeTimer = a.activeStartedAt ? ` ⏱ ${dur(now - a.activeStartedAt)}` : ''
    const toolPart = a.activeTool ? `${a.activeTool}${activeTimer}` : ''
    const st = a.status === 'running' ? (toolPart || (p.total ? `${p.done}/${p.total}` : a.tps > 0 ? Math.round(a.tps) + ' tok/s' : 'working')) : a.id === MAIN && a.status === 'idle' && a.endedAt ? 'waiting for you' : a.status === 'error' ? 'failed' : a.status
    const span = b.lastElementChild
    if (span.textContent !== st) span.textContent = st
    const cls = 'st ' + a.status
    if (span.className !== cls) span.className = cls
  }

  const subs = g.order.map(id => g.agents[id]).filter(a => a && a.id !== MAIN)
  const runningSub = subs.find(a => a.status === 'running')
  if (!userSelected && g.agents[MAIN]?.status !== 'running' && runningSub && selected === MAIN) {
    selected = runningSub.id
  }

  if (!g.agents[selected]) selected = MAIN
  renderAgent(g, g.agents[selected], now)
  renderWire(g, now)
}

function renderAgent(g, a, now) {
  if (!a) return
  const c = colorOf(a)
  const el = $('agent')
  if (!el.querySelector('#agent-h')) el.innerHTML = '<div id="agent-h"></div><div id="agent-b" role="tabpanel"></div>'
  const head = `<div class="agent-head"><h3 style="color:${c}">${esc(a.label)}</h3>
    <p>${esc(a.id === MAIN ? 'The orchestrator: talks to you, plans, hands out work' : a.isProcess ? 'External process started by ' + ((a.parent && g.agents[a.parent] && g.agents[a.parent].label) || 'agent') : a.type + (a.parent && a.parent !== MAIN && g.agents[a.parent] ? ', started by ' + g.agents[a.parent].label : ''))}</p></div>
    <div class="tabs" role="tablist" aria-label="About ${esc(a.label)}">
      ${[['overview', 'Overview'], ['context', 'Context'], ['packets', 'Packets']].map(([k, n]) =>
        `<button type="button" role="tab" class="chamfer" data-tab="${k}" aria-selected="${tab === k}">${n}</button>`).join('')}
    </div>`
  setHtml($('agent-h'), head)
  const bodyEl = $('agent-b')
  bodyEl.style.setProperty('--tone', c)
  const body = tab === 'context' ? contextTab(g, a, now) : tab === 'packets' ? packetsTab(g, a, now) : overviewTab(g, a, now)
  const list = bodyEl.querySelector('.entries')
  const keepScroll = list ? list.scrollTop : null
  const atBottom = list ? list.scrollHeight - list.scrollTop - list.clientHeight < 8 : true
  if (setHtml(bodyEl, body)) {
    const fresh = bodyEl.querySelector('.entries')
    if (fresh) fresh.scrollTop = atBottom ? fresh.scrollHeight : keepScroll
  }
}

function overviewTab(g, a, now) {
  const running = a.status === 'running'
  const p = progressOf(a)
  const e = etaOf(a, now)
  const nowLine = a.activity ? 'Now: ' + esc(a.activity)
    : running ? (p.current ? esc(p.current) : a.tps > 0 ? 'Writing its answer' : 'Thinking about its next step')
    : a.status === 'done' ? 'Finished and reported back'
    : a.status === 'error' ? 'Stopped with an error'
    : a.id === MAIN && a.endedAt ? 'Done with its turn. Waiting for you' : 'Waiting for you'
  let eta = ''
  if (running && e) {
    eta = `<div class="eta">${e.text ? `<p>${e.text}</p>` : ''}${e.frac !== null ? `<div class="bar${e.estimate ? ' est' : ''}" style="--tone:var(--yellow)"><i style="width:${Math.round(e.frac * 100)}%;background:var(--yellow)"></i></div>` : ''}</div>`
  }
  if (a.isProcess) {
    const end = a.endedAt
    return `<p class="now">${nowLine}</p>${eta}
      <h4>Process details</h4>
      <dl class="facts">
        <dt>Command</dt><dd class="text"><code>${esc(a.task || a.role)}</code></dd>
        <dt>Started</dt><dd>${a.startedAt ? clock(a.startedAt) : '—'}</dd>
        ${end ? `<dt>Finished</dt><dd>${clock(end)} <span class="soft">after ${dur(end - a.startedAt)}</span></dd>`
              : running ? `<dt>Running for</dt><dd>${dur(now - a.startedAt)}</dd>` : ''}
        ${a.lastActiveAt ? `<dt>Last activity</dt><dd>${ago(now - a.lastActiveAt)}</dd>` : ''}
      </dl>
      ${a.result ? `<h4>Process output</h4><pre class="quote" style="white-space:pre-wrap;font-family:var(--font-mono,monospace);font-size:12px;max-height:240px;overflow:auto;">${esc(a.result)}</pre>` : ''}`
  }

  const openTool = (a.toolLog || []).slice().reverse().find(tl => tl.end === undefined)
  const activeElapsed = a.activeStartedAt ? dur(now - a.activeStartedAt) : openTool ? dur(now - openTool.at) : null
  const isLong = (a.activeStartedAt && now - a.activeStartedAt > 120_000) || (openTool && now - openTool.at > 120_000)
  const liveBanner = (a.activity || a.activeDetail || openTool) && running ? `
    <div class="live-card${isLong ? ' long' : ''}">
      <div class="live-head">
        <span class="live-dot"></span>
        <span class="live-tool">${esc(a.activeTool || (openTool && openTool.tool) || 'IN PROGRESS')}</span>
        ${activeElapsed ? `<span class="live-time">⏱ Running for ${activeElapsed}${isLong ? ' (takes longer than usual)' : ''}</span>` : ''}
      </div>
      ${a.activity ? `<div class="live-desc">${esc(a.activity)}</div>` : ''}
      ${(a.activeDetail || (openTool && openTool.detail)) ? `<div class="live-cmd"><code>$ ${esc(a.activeDetail || openTool.detail)}</code></div>` : ''}
    </div>` : ''

  const todos = (a.todos || []).map(t => `<li class="${t.status}">${esc(t.status === 'in_progress' && t.active ? t.active : t.text)}</li>`).join('')
  const tools = (a.toolLog || []).slice(-12).reverse().map(tl => {
    const isOpen = tl.end === undefined
    const durationStr = isOpen ? 'running ' + dur(now - tl.at) : dur(tl.end - tl.at)
    const detailRow = tl.detail ? `<div class="tool-cmd"><code>${esc(tl.detail)}</code></div>` : ''
    return `<li class="${isOpen ? 'open' : ''}">
      <span title="${esc(tl.text)}">${isOpen ? '▶ ' : ''}${esc(tl.text)}</span>
      <span>${durationStr}</span>
      ${detailRow}
    </li>`
  }).join('')
  const end = a.endedAt
  return `${liveBanner}
    <p class="now">${nowLine}</p>${eta}
    ${todos ? `<h4>Its plan, ${p.done} of ${p.total} done</h4><ul class="todos">${todos}</ul>` : ''}
    <h4>Timing and tokens</h4>
    <dl class="facts">
      ${a.id === MAIN ? '' : `<dt>Asked to</dt><dd class="text">${esc(a.role)}</dd>`}
      <dt>Started</dt><dd>${a.startedAt ? clock(a.startedAt) : '—'}</dd>
      ${end ? `<dt>Finished</dt><dd>${clock(end)} <span class="soft">after ${dur(end - a.startedAt)}</span></dd>`
            : running ? `<dt>Running for</dt><dd>${dur(now - a.startedAt)}</dd>` : ''}
      ${a.lastActiveAt ? `<dt>Last activity</dt><dd>${ago(now - a.lastActiveAt)}</dd>` : ''}
      <dt>Model</dt><dd>${esc(a.model || '—')}</dd>
      ${a.ctxTok ? `<dt>Context</dt><dd>${fmt(a.ctxTok)} tokens in its last request</dd>` : ''}
      <dt>Tokens read</dt><dd>${fmt(a.inTok)} <span class="soft">(${fmt(a.cacheTok)} from cache)</span></dd>
      <dt>Tokens written</dt><dd>${fmt(a.outTok + Math.round(a.liveOut || 0))}</dd>
      <dt>Speed</dt><dd>${running && a.tps > 0 ? Math.round(a.tps) + ' tok/s now, ' : ''}peak ${Math.round(a.peakTps || 0)} tok/s</dd>
      <dt>Requests</dt><dd>${a.steps}</dd>
      <dt>Tool calls</dt><dd>${a.tools}</dd>
    </dl>
    ${tools ? `<h4>Recent tool calls</h4><ul class="tools">${tools}</ul>` : ''}
    ${a.result ? `<h4>What it reported</h4><p class="quote">${esc(a.result)}</p>` : ''}`
}

function contextTab(g, a, now) {
  if (a.isProcess) {
    return '<p class="note">External process executed directly via Bash. It does not carry an LLM conversation context or transcript.</p>'
  }
  const snap = contexts.agents[a.id]
  const isMain = a.id === MAIN
  const total = (snap && snap.ctxTok) || a.ctxTok || 0
  const mc = isMain ? contexts.main : null
  let segs = []
  if (mc && mc.categories && mc.categories.length) {
    const pal = ['#B48CFF', '#00E5FF', '#F3E600', '#3DFF8F', '#FF8A00', '#FF2E88', '#7FE7FF']
    let k = 0
    segs = mc.categories.filter(c => c.kind === 'used' && c.tokens > 0).map(c => ({ name: c.name, tok: c.tokens, color: pal[k++ % pal.length] }))
  } else if (snap) {
    const parts = snap.parts || {}
    const sum = Object.values(parts).reduce((s, v) => s + v, 0)
    if (total > sum) segs.push({ name: 'System prompt and tool definitions', tok: total - sum, color: '#5B5285', est: true })
    for (const k of ['prompt', 'user', 'reply', 'call', 'result', 'error']) if (parts[k]) segs.push({ name: KIND_NAME[k], tok: parts[k], color: KIND_COLOR[k] })
  }
  const sumSegs = segs.reduce((s, x) => s + x.tok, 0) || 1
  const head = mc && mc.window
    ? `<p class="ctx-sum"><b>${fmt(mc.tokens || total)}</b> of ${fmt(mc.window)} tokens in its window${mc.percent !== undefined ? `, <b>${mc.percent}%</b> full` : ''}</p>`
    : total ? `<p class="ctx-sum">Its last request carried <b>${fmt(total)}</b> tokens of context</p>` : ''
  const bar = segs.length ? `<div class="stack">${segs.map(s => `<i style="flex:${s.tok / sumSegs};background:${s.color}" title="${esc(s.name)}: ${fmt(s.tok)}"></i>`).join('')}</div>
    <ul class="legend">${segs.map(s => `<li class="${s.est ? 'est' : ''}"><i style="background:${s.color}"></i><span>${esc(s.name)}</span><span>${fmt(s.tok)}</span></li>`).join('')}</ul>` : ''
  if (!snap) {
    return head + bar + `<p class="note">${a.status === 'running' || isMain ? 'Its transcript shows up here after its next request.' : 'No transcript was read for this agent.'} The page reads each agent's conversation from Claude Code: the task it was handed, what it wrote, every tool call and what came back.</p>`
  }
  const rows = snap.entries.map((x, i) => {
    const key = a.id + ':' + i + ':' + x.title
    return `<li><details data-key="${esc(key)}"${openEntries.has(key) ? ' open' : ''}><summary><i style="background:${KIND_COLOR[x.kind]}"></i><span title="${esc(x.title)}">${esc(x.title)}</span><span>${fmt(x.tok)}</span></summary><pre>${esc(x.preview)}</pre></details></li>`
  })
  if (snap.skipped) rows.splice(1, 0, `<li class="skipped">${snap.skipped} earlier entries not shown</li>`)
  return head + bar +
    `<h4>What is in it, oldest first (${snap.msgs} messages)</h4>
    <ul class="entries">${rows.join('')}</ul>
    <p class="note">Read ${ago(now - snap.at)}. Token counts per entry are estimates (characters ÷ 4).${snap.denied ? ' Its transcript can no longer be read; this is the last copy.' : ''}</p>`
}

function packetsTab(g, a, now) {
  const mine = g.links.filter(l => l.from === a.id || l.to === a.id).slice().reverse()
  if (!mine.length) return '<p class="wire-empty">Nothing has gone in or out of this agent yet.</p>'
  return `<ul class="wire">${mine.map(l => wireItem(g, l, now)).join('')}</ul>`
}

function wireItem(g, l, now) {
  const f = g.agents[l.from], to = g.agents[l.to]
  const fc = f ? colorOf(f) : '#fff', tc = to ? colorOf(to) : '#fff'
  return `<li><button type="button" data-link="${l.id}"><div class="route"><span style="color:${fc}">${esc(f ? f.label : l.from)}</span><span class="arrow">→</span><span style="color:${tc}">${esc(to ? to.label : l.to)}</span>
    <span class="kind ${l.kind}">${PACKET_NAME[l.kind]}</span><span class="meta">${fmt(l.tokens)} tok, ${ago(now - l.at)}</span></div><p>${esc(l.text)}</p></button></li>`
}

function renderWire(g, now) {
  const wire = $('wire')
  const links = g.links.slice(-40).reverse()
  if (!links.length) {
    setHtml(wire, '<p class="wire-empty">Nothing has been handed off yet.</p>')
    renderedLinks = 0
    return
  }
  if (setHtml(wire, links.map(l => wireItem(g, l, now)).join(''))) {
    const newest = links[0].id
    if (newest > renderedLinks && renderedLinks !== 0) wire.firstElementChild.classList.add('fresh')
    renderedLinks = newest
  }
}

// ---------- packet inspector ----------
let openPacket = null
function openDrawer(id) { openPacket = id; renderDrawer(); $('drawer').querySelector('.close')?.focus() }
function closeDrawer() { openPacket = null; $('drawer').classList.remove('open'); $('drawer').dataset.html = '' }
function renderDrawer() {
  const g = graph
  const d = $('drawer')
  if (!g || openPacket === null) return
  const link = g.links.find(l => l.id === openPacket)
  const full = packets.get(openPacket)
  const p = full || link
  if (!p) return closeDrawer()
  const f = g.agents[p.from], to = g.agents[p.to]
  const meta = full ? Object.entries(full.meta || {}).map(([k, v]) => `<dt>${esc(k)}</dt><dd${typeof v === 'string' && v.length > 24 ? ' class="text"' : ''}>${esc(v === true ? 'yes' : v === false ? 'no' : typeof v === 'number' ? (v >= 1000 ? fmt(v) : v) : v)}</dd>`).join('') : ''
  const bodyText = full ? full.body : (link ? link.text : '')
  const what = { spawn: 'The prompt the subagent starts from. It sees nothing of the parent\'s conversation but this.', report: 'The final answer the subagent handed back. This is all its parent learns of its work.', message: 'Sent with SendMessage between two running agents.' }[p.kind]
  const html = `<header><div class="row"><span class="kind ${p.kind}">${PACKET_NAME[p.kind]}</span><button type="button" class="close chamfer">Close</button></div>
      <h2 id="d-title"><span style="color:${f ? colorOf(f) : '#fff'}">${esc(f ? f.label : p.from)}</span><span class="arrow">→</span><span style="color:${to ? colorOf(to) : '#fff'}">${esc(to ? to.label : p.to)}</span></h2>
      <p class="sub">${clock(p.at)}, about ${fmt(p.tokens)} tokens</p></header>
    <div class="scroll">
      <p class="note" style="margin:0 0 14px">${what}</p>
      ${meta ? `<dl class="facts">${meta}</dl>` : ''}
      <div class="bodyhead"><h3>${p.kind === 'report' ? 'The report' : p.kind === 'spawn' ? 'The prompt' : 'The message'}</h3><button type="button" class="copy chamfer">Copy</button></div>
      <pre>${esc(bodyText)}</pre>
      ${full && full.truncated ? '<p class="note">Cut at 24,000 characters.</p>' : ''}
      ${!full ? '<p class="note">Only the opening was kept for this packet: it was sent before this page started reading.</p>' : ''}
    </div>`
  setHtml(d, html)
  d.classList.add('open')
}
$('drawer').addEventListener('click', e => {
  if (e.target.closest('.close')) closeDrawer()
  if (e.target.closest('.copy')) {
    const pre = $('drawer').querySelector('pre')
    try { navigator.clipboard.writeText(pre.textContent); e.target.textContent = 'Copied' } catch {}
  }
})
addEventListener('keydown', e => { if (e.key === 'Escape' && openPacket !== null) closeDrawer() })

// ---------- interaction ----------
function select(id) {
  if (!id || !graph || !graph.agents[id]) return
  userSelected = true
  selected = id
  renderRail()
}
/**
 * The rail redraws as numbers tick, which can swap a button out between mouse down and up and
 * swallow the click. A mouse acts on press; touch and keyboard act on click as usual.
 */
function onPick(el, fn) {
  el.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && e.button === 0 && fn(e.target)) e.preventDefault() })
  el.addEventListener('click', e => { if (e.pointerType !== 'mouse' && !(e.detail > 0 && matchMedia('(pointer: fine)').matches)) fn(e.target) })
}
onPick($('tabs'), t => { const b = t.closest('button[data-sid]'); if (b) openSession(b.dataset.sid); return !!b })
onPick($('agents'), t => {
  if (t.closest('button[data-done]')) { toggleDone(); return true }
  const b = t.closest('button[data-id]'); if (b) select(b.dataset.id); return !!b
})
$('donechip').addEventListener('click', toggleDone)
onPick($('attention'), t => { const b = t.closest('button[data-id]'); if (b) select(b.dataset.id); return !!b })
onPick($('agent'), target => {
  const t = target.closest('button[data-tab]')
  if (t) { tab = t.dataset.tab; try { localStorage.setItem('agent-flow-tab', tab) } catch {}; renderRail(); return true }
  const l = target.closest('button[data-link]')
  if (l) { openDrawer(Number(l.dataset.link)); return true }
  return false
})
$('agent').addEventListener('toggle', e => {
  const d = e.target
  if (!d.dataset || !d.dataset.key) return
  if (d.open) openEntries.add(d.dataset.key); else openEntries.delete(d.dataset.key)
  // the panel's cached html must learn the new open state, or the next render reverts it
  $('agent-b').dataset.html = ''
}, true)
onPick($('wire'), t => { const l = t.closest('button[data-link]'); if (l) openDrawer(Number(l.dataset.link)); return !!l })
document.querySelector('.views').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]'); if (!b) return
  view = b.dataset.view
  for (const x of document.querySelectorAll('.views button')) x.setAttribute('aria-pressed', String(x === b))
  try { localStorage.setItem('agent-flow-view', view) } catch {}
})
try {
  const v = localStorage.getItem('agent-flow-view')
  if (v === 'timeline' || v === 'map') { view = v; for (const x of document.querySelectorAll('.views button')) x.setAttribute('aria-pressed', String(x.dataset.view === v)) }
  const tb = localStorage.getItem('agent-flow-tab'); if (tb === 'overview' || tb === 'context' || tb === 'packets') tab = tb
  if (localStorage.getItem('agent-flow-bell')) { bellOn = true; $('bell').setAttribute('aria-pressed', 'true') }
  if (localStorage.getItem('agent-flow-done')) showDone = true
} catch {}
addEventListener('pointerdown', () => { if (bellOn && !audio) try { audio = new (window.AudioContext || window.webkitAudioContext)() } catch {} }, { once: true })

// ---------- dragging orbs: a layout of your own, kept per session ----------
let pins = {} // agent id -> where it was dropped, as fractions of the map's size
let drag = null
const pinKey = () => 'agent-flow-pins:' + (active || 'none')
function loadPins() { try { pins = JSON.parse(localStorage.getItem(pinKey()) || '{}') || {} } catch { pins = {} } }
function savePins() { try { localStorage.setItem(pinKey(), JSON.stringify(pins)) } catch {} ; $('resetpins').hidden = !Object.keys(pins).length }
$('resetpins').addEventListener('click', () => { pins = {}; savePins() })

function pointAt(e) {
  const r = canvas.getBoundingClientRect()
  return { x: e.clientX - r.left, y: e.clientY - r.top }
}
function hit(p) {
  if (view === 'map') {
    for (const id of Object.keys(nodes)) { const n = nodes[id]; if (Math.hypot(p.x - n.x, p.y - n.y) <= n.r + 12) return { id } }
    return null
  }
  for (const d of dots) if (Math.hypot(p.x - d.x, p.y - d.y) <= 7) return { link: d.link }
  for (const tk of ticks) if (p.x >= tk.x0 && p.x <= tk.x1 && p.y >= tk.y0 && p.y <= tk.y1) return { id: tk.id, tool: tk.tool }
  for (const l of lanes) if (p.y >= l.y && p.y < l.y + l.h) return { id: l.id }
  return null
}
canvas.addEventListener('pointerdown', e => {
  if (view !== 'map' || e.button !== 0) return
  const p = pointAt(e)
  const h = hit(p)
  if (!h || !h.id || !nodes[h.id]) return
  drag = { id: h.id, ox: nodes[h.id].x - p.x, oy: nodes[h.id].y - p.y, startX: p.x, startY: p.y, moved: false }
  try { canvas.setPointerCapture(e.pointerId) } catch {}
})
canvas.addEventListener('pointerup', e => {
  if (!drag) return
  const d = drag
  drag = null
  canvas.classList.remove('dragging')
  if (d.moved) savePins()
  else select(d.id)
})
canvas.addEventListener('pointercancel', () => { drag = null; canvas.classList.remove('dragging') })
const tip = $('tip')
canvas.addEventListener('pointermove', e => {
  const p = pointAt(e)
  if (drag) {
    if (!drag.moved && Math.hypot(p.x - drag.startX, p.y - drag.startY) > 4) { drag.moved = true; canvas.classList.add('dragging'); tip.style.display = 'none' }
    if (drag.moved) {
      const x = Math.max(30, Math.min(W - 30, p.x + drag.ox)), y = Math.max(60, Math.min(H - 60, p.y + drag.oy))
      pins[drag.id] = { fx: x / W, fy: y / H }
      if (nodes[drag.id]) { nodes[drag.id].x = x; nodes[drag.id].y = y }
    }
    return
  }
  const h = hit(p)
  hoverId = h && h.id ? h.id : null
  canvas.classList.toggle('pointing', !!h)
  let html = ''
  if (h && h.tool && graph) {
    const a = graph.agents[h.id]
    html = `<b>${esc(h.tool.text)}</b><span>${esc(a ? a.label : '')}, ${clock(h.tool.at)}, ${h.tool.end === undefined ? 'still running' : 'took ' + dur(h.tool.end - h.tool.at)}</span>`
  } else if (h && h.link && graph) {
    const l = h.link, f = graph.agents[l.from], to = graph.agents[l.to]
    html = `<b>${PACKET_NAME[l.kind]}: ${esc(f ? f.label : l.from)} → ${esc(to ? to.label : l.to)}</b><span>${clock(l.at)}, ${fmt(l.tokens)} tok. Click to read it.</span>`
  }
  if (html) {
    tip.innerHTML = html
    tip.style.display = 'block'
    tip.style.left = Math.min(p.x + 14, W - 350) + 'px'
    tip.style.top = (p.y + 16) + 'px'
  } else tip.style.display = 'none'
})
canvas.addEventListener('mouseleave', () => { hoverId = null; tip.style.display = 'none' })
canvas.addEventListener('click', e => {
  if (view === 'map') return // the map selects on pointer up, so a drag is not a click
  const h = hit(pointAt(e))
  if (!h) return
  if (h.link) openDrawer(h.link.id)
  else select(h.id)
})

// ---------- demo: a realistic run. Subagents never talk to each other here: each gets a task and reports back ----------
// the demo plays three sessions: a big run, a small one that finishes while you watch the other, and a closed one
const DEMO_SESSIONS = [
  { id: 'demo-api', project: 'billing-api', cwd: '~/work/billing-api' },
  { id: 'demo-af', project: 'agent-flow', cwd: '~/work/agent-flow' },
  { id: 'demo-ct', project: 'notes-app', cwd: '~/work/notes-app' },
]
const demoFeed = {}
function demoPublish(sid, project, g, pk, ctxPayload) {
  demoFeed[sid] = { g, pk, ctx: ctxPayload }
  const Mi = mission(g, Date.now())
  noteMeta({ id: sid, project, lastSeen: Date.now(), state: Mi.state, running: Mi.running.filter(a => a.id !== MAIN).length, failed: Mi.failed.length, turnStart: Mi.turnStart, endedAt: Mi.m && Mi.m.endedAt })
  if (active === sid) demoShow(sid)
}
function demoShow(sid) {
  const f = demoFeed[sid]
  if (!f) return
  window.__AF_PUSH({ v: 2, now: Date.now(), graph: JSON.parse(JSON.stringify(f.g)), history: durations })
  window.__AF_PACKETS({ rev: f.pk.length, items: f.pk })
  if (f.ctx) window.__AF_CTX(f.ctx)
}

/** The small session: one Plan agent that reports back about 12s in, then the session waits for you. */
function demoSmall() {
  const sid = 'demo-af', t0 = Date.now()
  const g = { agents: {}, order: [], links: [], seq: 0, opened: true, startedAt: t0 }
  const blank = (id, label, type, role, color, parent) => { g.agents[id] = { id, label, type, role, task: '', parent, color, status: 'running', inTok: 0, outTok: 0, cacheTok: 0, steps: 1, tools: 0, liveOut: 0, tps: 0, peakTps: 0, startedAt: Date.now(), lastActiveAt: Date.now(), toolLog: [], model: 'claude-sonnet-5-5' }; g.order.push(id); return g.agents[id] }
  const m = blank(MAIN, 'MAIN', 'orchestrator', 'Talks to you, plans, delegates', 0)
  m.model = 'claude-opus-5-5'
  const pk = []
  const link = (from, to, kind, body) => { g.seq++; const l = { id: g.seq, from, to, kind, tokens: Math.ceil(body.length / 4), text: clip(body, 120), at: Date.now() }; g.links.push(l); pk.push({ ...l, body, truncated: false, meta: {} }) }
  setTimeout(() => { const a = blank('p1', 'Plan #1', 'Plan', 'Plan the web tab view', 2, MAIN); link(MAIN, 'p1', 'spawn', 'Plan how the dashboard should show one tab per Claude Code session.') }, 1500)
  setTimeout(() => { const a = g.agents.p1; a.status = 'done'; a.endedAt = Date.now(); a.tps = 0; a.result = 'One dashboard, a tab per session, data kept per session folder.'; link('p1', MAIN, 'report', a.result) }, 9000)
  setTimeout(() => { m.status = 'idle'; m.endedAt = Date.now(); m.tps = 0 }, 12000)
  const tick = setInterval(() => {
    for (const id of g.order) { const a = g.agents[id]; if (a.status !== 'running') continue; a.tps = 90 + Math.random() * 120; a.peakTps = Math.max(a.peakTps, a.tps); a.liveOut += a.tps / 10; a.inTok += 700 }
    demoPublish(sid, 'agent-flow', g, pk, null)
    if (Date.now() - t0 > 45000) { clearInterval(tick); setTimeout(demoSmall, 500) }
  }, 100)
}

function demoRun() {
  const t0 = Date.now()
  const g = { agents: {}, order: [], links: [], seq: 0, opened: true, startedAt: t0 }
  const ctxA = {}
  const pk = []
  durations = {
    Explore: [9000, 14000, 11000, 16000, 12500],
    Plan: [12000, 15000, 10500],
    'general-purpose': [14000, 18000, 13000],
    [MAIN_TURN]: [22000, 26000, 19000, 24000],
  }
  const now = () => Date.now()
  const agent = (id, label, type, role, color, parent) => {
    g.agents[id] = { id, label, type, role, task: '', parent, color, status: 'idle', inTok: 0, outTok: 0, cacheTok: 0, steps: 0, tools: 0, liveOut: 0, tps: 0, peakTps: 0, startedAt: now(), lastActiveAt: now(), toolLog: [] }
    g.order.push(id)
    return g.agents[id]
  }
  const est = s => Math.ceil(s.length / 4)
  const entry = (id, kind, title, text) => {
    const c = ctxA[id] || (ctxA[id] = { at: now(), msgs: 0, parts: { prompt: 0, user: 0, reply: 0, call: 0, result: 0, error: 0 }, entries: [], skipped: 0 })
    c.entries.push({ kind, title, tok: est(text), preview: text })
    c.parts[kind] += est(text)
    c.msgs = c.entries.length
    c.at = now()
    c.ctxTok = (g.agents[id] && g.agents[id].ctxTok) || undefined
  }
  const link = (from, to, kind, body, meta) => {
    g.seq++
    const l = { id: g.seq, from, to, kind, tokens: est(body), text: clip(body, 120), at: now() }
    g.links.push(l)
    pk.push({ ...l, body, truncated: false, meta })
  }
  const closeTool = id => { const a = g.agents[id]; for (const tl of a.toolLog) if (tl.end === undefined) tl.end = now(); a.activity = undefined }
  const tool = (id, text, result) => {
    const a = g.agents[id]; closeTool(id); a.tools++; a.activity = text; a.toolLog.push({ at: now(), text }); a.lastActiveAt = now()
    entry(id, 'call', text, JSON.stringify({ call: text }))
    if (result) setTimeout(() => entry(id, result.error ? 'error' : 'result', (result.error ? 'Error from ' : 'Result of ') + text, result.text), 500)
  }
  const todos = list => { g.agents[MAIN].todos = list.map(([text, status, active]) => ({ text, status, active })) }
  const spawn = (id, label, type, role, color, parent, prompt, model) => {
    const a = agent(id, label, type, role, color, parent)
    a.task = clip(prompt, 160); a.status = 'running'; a.model = model
    link(parent, id, 'spawn', prompt, { 'Agent type': type, 'Asked to': role, Model: model, "Parent's model": 'claude-opus-5-5', 'Runs in the background': false, 'Fork (inherits the parent context)': false })
    entry(id, 'prompt', 'The task it was handed', prompt)
    a.ctxTok = 14000 + est(prompt)
    ctxA[id].ctxTok = a.ctxTok
  }
  const finish = (id, inT, outT, cache, text, failed) => {
    const a = g.agents[id]; closeTool(id)
    a.status = failed ? 'error' : 'done'; a.inTok += inT; a.outTok += outT; a.cacheTok += cache; a.steps += 3; a.endedAt = now(); a.lastActiveAt = now(); a.result = text; a.tps = 0
    entry(id, 'reply', 'Wrote', text)
    link(id, a.parent || MAIN, 'report', text, { Outcome: failed ? 'error' : 'answer', 'Ran for': Math.round((a.endedAt - a.startedAt) / 1000) + 's', 'Tokens read': Math.round(a.inTok), 'Tokens written': Math.round(a.outTok), Requests: a.steps, 'Tool calls': a.tools })
  }
  agent(MAIN, 'MAIN', 'orchestrator', 'Talks to you, plans, delegates', 0)
  const m = g.agents[MAIN]
  const S = []
  const step = (ms, fn) => S.push([ms, fn])
  const TASK_1 = 'Find where JWT tokens are issued, validated and refreshed across the services in this repository.\n\nReport: the files and functions involved, the order a request goes through them, and where the refresh endpoint lives. Do not change any code.'
  const TASK_2 = 'Design a zero-downtime migration of the session store from Redis to Postgres.\n\nConstraints: no user may be logged out during the switch; the old store must stay readable for one release. Give the steps in order with a rollback for each.'
  const TASK_3 = 'Write a k6 load test for the login flow at 2,000 requests per second.\n\nIt should ramp up over 2 minutes, hold for 10, refresh tokens every 10 minutes per virtual user, and fail if p95 latency goes over 120 ms. Put it in tests/login.k6.js.'
  const TASK_4 = 'Find the CI job that runs the integration tests and tell me which environment variables it needs.'
  const TASK_5 = 'Search the gateway Helm charts for every auth-related filter and say what each one does.'
  step(0, () => { m.status = 'running'; m.model = 'claude-opus-5-5'; m.startedAt = now(); m.endedAt = undefined; m.ctxTok = 41000
    entry(MAIN, 'user', 'You', 'Our login is slow under load and we want to move sessions to Postgres. Map the auth flow, plan the migration, and write a load test.')
    tool(MAIN, 'Read the repository layout', { text: 'src/\n  auth/\n  gateway/\n  session/\ncharts/\ntests/\n.ci/' }) })
  step(900, () => { closeTool(MAIN); todos([['Map the auth flow', 'in_progress', 'Mapping the auth flow'], ['Plan the session store migration', 'pending'], ['Write the load test', 'pending'], ['Check the CI setup', 'pending'], ['Summarize for you', 'pending']]); tool(MAIN, 'TodoWrite: 5 steps') })
  step(1200, () => { closeTool(MAIN); tool(MAIN, 'Agent → Explore: Map the auth flow'); spawn('d1', 'Explore #1', 'Explore', 'Map the auth flow', 1, MAIN, TASK_1, 'claude-haiku-5-5') })
  step(1700, () => tool('d1', 'Glob src/**/auth*', { text: 'src/auth/middleware.ts\nsrc/auth/token.ts\nsrc/auth/refresh.ts' }))
  step(2400, () => { todos([['Map the auth flow', 'in_progress', 'Mapping the auth flow'], ['Plan the session store migration', 'in_progress', 'Planning the migration'], ['Write the load test', 'pending'], ['Check the CI setup', 'pending'], ['Summarize for you', 'pending']]); spawn('d2', 'Plan #1', 'Plan', 'Design storage migration', 2, MAIN, TASK_2, 'claude-sonnet-5-5') })
  step(3000, () => tool('d1', 'Read src/auth/middleware.ts', { text: 'export async function authenticate(req) {\n  const token = req.headers.authorization?.slice(7)\n  const claims = await validateToken(token)\n  ...' }))
  step(3200, () => tool('d2', 'Read docs/storage.md', { text: '# Session storage\nSessions live in Redis (cluster of 3), TTL 24h, key session:{id}...' }))
  step(3600, () => spawn('d3', 'Explore #2', 'Explore', 'Check CI config', 4, MAIN, TASK_4, 'claude-haiku-5-5'))
  step(4100, () => spawn('d4', 'tester', 'general-purpose', 'Write load test', 3, MAIN, TASK_3, 'claude-sonnet-5-5'))
  step(4600, () => tool('d4', 'Read tests/README.md', { text: 'Tests run with `npm test`. Load tests live in tests/*.k6.js and run with k6.' }))
  step(4800, () => tool('d3', 'Read .ci/pipeline.yml', { error: true, text: 'File does not exist: .ci/pipeline.yml' }))
  step(5200, () => tool('d1', 'Grep "validateToken" src/', { text: 'src/auth/middleware.ts:12\nsrc/auth/token.ts:4\nsrc/gateway/filters.ts:31' }))
  step(5800, () => tool('d2', 'Grep "SessionStore" src/', { text: 'src/session/store.ts:1: export class SessionStore\nsrc/session/redis.ts:8' }))
  step(6000, () => spawn('d5', 'Explore #3', 'Explore', 'Scan gateway configs', 5, 'd1', TASK_5, 'claude-haiku-5-5'))
  step(6500, () => tool('d5', 'Glob charts/gateway/**', { text: 'charts/gateway/values.yaml\ncharts/gateway/templates/filters.yaml' }))
  step(7000, () => tool('d4', 'Write tests/login.k6.js', { text: 'File written (84 lines).' }))
  step(7400, () => tool('d3', 'Glob .github/workflows/*', { text: 'No files found' }))
  step(8200, () => finish('d3', 9000, 400, 8000, 'There is no CI configuration in this repository: neither .ci/pipeline.yml nor .github/workflows exists, so I could not find the integration test job.', true))
  step(8400, () => tool('d5', 'Read charts/gateway/values.yaml', { text: 'filters:\n  - name: jwt-verify\n  - name: rate-limit-auth\n  - name: mtls-edge' }))
  step(8800, () => tool('d2', 'Write plan.md', { text: 'File written.' }))
  step(10200, () => tool('d4', 'Bash: k6 inspect tests/login.k6.js', { text: 'execution: local\nscenarios: login (ramping-vus)' }))
  step(11000, () => finish('d5', 13000, 900, 12000, 'Three auth filters in the gateway chart: jwt-verify (checks the token signature and expiry), rate-limit-auth (20 login attempts per minute per IP), mtls-edge (client certificates for internal callers).'))
  step(12800, () => { finish('d2', 54000, 5200, 52000, 'Migration plan:\n1. Dual-write: write sessions to Redis and Postgres.\n2. Shadow-read from Postgres and compare.\n3. Cut reads over per service behind a flag.\n4. Stop Redis writes after one release.\nEach step rolls back by flipping its flag.')
    todos([['Map the auth flow', 'in_progress', 'Mapping the auth flow'], ['Plan the session store migration', 'completed'], ['Write the load test', 'in_progress', 'Writing the load test'], ['Check the CI setup', 'completed'], ['Summarize for you', 'pending']]) })
  step(14800, () => { finish('d1', 39000, 2800, 38000, 'Auth flow: the gateway\'s jwt-verify filter, then authenticate() in src/auth/middleware.ts, then validateToken() in src/auth/token.ts, then the SessionStore. Refresh is POST /auth/refresh in src/auth/refresh.ts with a 15 minute TTL.')
    todos([['Map the auth flow', 'completed'], ['Plan the session store migration', 'completed'], ['Write the load test', 'in_progress', 'Writing the load test'], ['Check the CI setup', 'completed'], ['Summarize for you', 'pending']]) })
  step(16800, () => { finish('d4', 32000, 3100, 30000, 'Wrote tests/login.k6.js: ramps to 2,000 requests per second over 2 minutes, holds for 10, refreshes tokens every 10 minutes, and fails if p95 is over 120 ms.')
    todos([['Map the auth flow', 'completed'], ['Plan the session store migration', 'completed'], ['Write the load test', 'completed'], ['Check the CI setup', 'completed'], ['Summarize for you', 'in_progress', 'Writing the summary']]) })
  step(17200, () => { closeTool(MAIN); tool(MAIN, 'Writing the summary') })
  step(21500, () => { closeTool(MAIN); m.status = 'idle'; m.endedAt = now(); m.inTok += 113000; m.outTok += 2300; m.tps = 0
    todos([['Map the auth flow', 'completed'], ['Plan the session store migration', 'completed'], ['Write the load test', 'completed'], ['Check the CI setup', 'completed'], ['Summarize for you', 'completed']])
    entry(MAIN, 'reply', 'Wrote', 'Here is what the agents found: the auth flow, a four-step migration plan, and a load test. The CI check failed: this repository has no CI configuration.') })
  let i = 0
  const tick = setInterval(() => {
    const e = Date.now() - t0
    while (i < S.length && S[i][0] <= e) S[i++][1]()
    for (const id of g.order) {
      const a = g.agents[id]
      if (a.status !== 'running') continue
      const target = id === MAIN ? 60 : 120 + (id.charCodeAt(1) * 37) % 220
      a.tps += (target * (0.6 + Math.random() * 0.8) - a.tps) * 0.3
      a.peakTps = Math.max(a.peakTps, a.tps)
      a.liveOut += a.tps / 10
      a.inTok += 900 + Math.random() * 500
      a.ctxTok = (a.ctxTok || 14000) + 60
      if (ctxA[id]) ctxA[id].ctxTok = a.ctxTok
      a.lastActiveAt = Date.now()
    }
    demoPublish('demo-api', 'billing-api', g, pk, { rev: e, agents: JSON.parse(JSON.stringify(ctxA)), main: { window: 200000, tokens: m.ctxTok, percent: Math.round(m.ctxTok / 2000), at: Date.now(),
      categories: [{ name: 'System prompt', tokens: 3100, kind: 'used' }, { name: 'System tools', tokens: 14800, kind: 'used' }, { name: 'MCP tools', tokens: 6200, kind: 'used' }, { name: 'Memory files', tokens: 2400, kind: 'used' }, { name: 'Skills', tokens: 1900, kind: 'used' }, { name: 'Messages', tokens: Math.max(1000, m.ctxTok - 28400), kind: 'used' }, { name: 'Free space', tokens: 200000 - m.ctxTok, kind: 'free' }] } })
    if (e > 29000) { clearInterval(tick); if (active === 'demo-api') { for (const k of Object.keys(burn)) delete burn[k]; packets.clear() } setTimeout(demoRun, 800) }
  }, 100)
}

// ---------- start ----------
async function start() {
  try { await document.fonts.ready } catch {}
  const cs = getComputedStyle(document.body)
  numFont = cs.getPropertyValue('--num') || 'monospace'
  displayFont = cs.getPropertyValue('--display') || 'sans-serif'
  resize()
  addEventListener('resize', resize)
  requestAnimationFrame(frame)
  setInterval(renderRail, 1000)
  if (DEMO) {
    window.__AF_SESSIONS({ sessions: DEMO_SESSIONS.map(x => ({ ...x, lastSeen: Date.now() })) })
    noteMeta({ id: 'demo-ct', project: 'notes-app', lastSeen: Date.now() - 3600_000, state: 'done' })
    demoRun(); demoSmall()
    openSession('demo-api')
    setInterval(() => { for (const x of sessionList) if (x.id !== 'demo-ct') x.lastSeen = Date.now(); renderTabs() }, 2000)
  }
  else {
    load('sessions.js')
    setInterval(() => load('sessions.js'), 4000)
    setInterval(() => { if (active) load(base() + 'state.js') }, 120)
    setInterval(() => { for (const x of sessionList) load('s/' + encodeURIComponent(x.id) + '/meta.js') }, 2000)
    setTimeout(() => { if (!sessionList.length) load('state.js') }, 1500) // an older single-session mod writes here
  }
}
start()
